<div class="toolbar report-toolbar"><div class="toolbar-inner"><span>地块综合分析</span><div class="toolbar-actions"><!-- LOCAL_REPORT_DOWNLOAD --><button id="print-report" class="export-pdf-button" type="button">导出 PDF</button></div></div></div>
<nav aria-label="报告章节"></nav><main class="paper paper-container" id="paper-root"></main>
<template id="canonical-results-template"><!-- SONO_CANONICAL_RESULTS --></template>
<script>
const REPORT_DATA = /* __REPORT_DATA__ */ {
};
const MODULE_ORDER=['plot_growth_analysis','plot_3d_phenotype','plot_growth_dynamics','plot_seedling_monitoring'];
const MODULE_INFO={plot_growth_analysis:{name:'长势分析'},plot_3d_phenotype:{name:'三维表型'},plot_growth_dynamics:{name:'生长动态'},plot_seedling_monitoring:{name:'苗情监控'},overall_report:{name:'整体报告'}};
const BAD_TEXT=new Set(['','nan','none','nil','n/a','--','-','—','无','暂无','未提供','null','undefined']);
function isPresent(v){if(v==void 0)return false;if(typeof v==='number')return Number.isFinite(v);if(typeof v==='boolean')return true;if(typeof v==='string')return !BAD_TEXT.has(v.trim().toLowerCase());if(Array.isArray(v))return v.some(isPresent);if(typeof v==='object')return Object.values(v).some(isPresent);return true}

function cleanArray(v){return Array.isArray(v)?v.filter(isPresent):[]}

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function text(v,fallback='—'){return isPresent(v)?escapeHtml(String(v).replace(/WOFOST/g,'作物生长模拟')):fallback}

function safeUrl(v){if(!isPresent(v))return '';try{const u=new URL(String(v));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}

function meta(){return REPORT_DATA.meta||{}}

function subtype(){const m=meta();return m.reportSubtype||m.report_type||(m.reportType==='plot_overall_report'?'overall_report':'')}

function isOverall(){return subtype()==='overall_report'||meta().reportType==='plot_overall_report'}

function plotName(){const m=meta();return m.plotName||m.subjectName||cleanArray(REPORT_DATA.plots)[0]?.name||'目标地块'}

function moduleTypeName(type){return (MODULE_INFO[type]&&MODULE_INFO[type].name)||String(type||'专项分析').replace(/_/g,' ')}

function levelClass(level){const s=String(level||'').toLowerCase();if(/red|danger|high|高|严重/.test(s))return 'danger';if(/amber|warn|mid|medium|中|风险|注意/.test(s))return 'warn';if(/blue|info|gray|grey|关注|信息/.test(s))return 'info';return ''}

function levelText(value){const s=String(value||'').trim().toLowerCase();if(!s)return '';if(/red|danger|high|高|严重/.test(s))return '高风险 / 需优先处置';if(/amber|warn|mid|medium|中|风险|注意/.test(s))return '需关注';if(/green|good|normal|low|正常|良好/.test(s))return '正常';if(/blue|info/.test(s))return '关注指标';if(/gray|grey/.test(s))return '信息项';return String(value)}

function displayValue(v,key=''){if(!isPresent(v))return '';const k=String(key||'').toLowerCase();if(['level','status','state','priority','tag','badge','说明'].some(x=>k.includes(x)))return levelText(v);const raw=String(v).trim();if(/^(red|green|blue|amber|gray|grey|warn|danger)$/i.test(raw))return levelText(raw);return raw}

function fieldLabel(key){return {label:'样本',date:'日期',time:'时间',day:'模型日',dvs:'DVS',lai:'LAI',tagp:'TAGP',twso:'TWSO',wso:'WSO',wlv:'WLV',wst:'WST',wrt:'WRT',soilMoisture:'SM',sm:'SM',rd:'RD',nUptakeTotal:'氮素吸收',ndvi:'NDVI',coverage:'覆盖度',fvc:'FVC',height:'株高',plantHeight:'株高',biomass:'生物量',density:'苗密度',emergenceRate:'出苗率',uniformity:'整齐度',area:'面积',ratio:'占比',level:'等级',status:'状态'}[key]||String(key).replace(/_/g,' ')}

function periodText(){const m=meta();const parts=[m.periodStart,m.periodEnd].filter(isPresent);if(parts.length===2)return parts.join(' 至 ');const dates=cleanArray(REPORT_DATA.moduleReports).flatMap(r=>[r.startDate,r.endDate,r.reportDate,r.date]).filter(isPresent);return parts[0]||dates.slice(0,2).join(' 至 ')||m.reportDate||'当前报告期'}

function getModules(){const mods=cleanArray(REPORT_DATA.moduleReports).filter(r=>r&&typeof r==='object');const st=subtype();if(isOverall())return mods.filter(r=>MODULE_ORDER.includes(r.type)).sort((a,b)=>MODULE_ORDER.indexOf(a.type)-MODULE_ORDER.indexOf(b.type));if(MODULE_ORDER.includes(st))return mods.filter(r=>r.type===st);return mods}

function metricItems(values){return cleanArray(values).map(item=>typeof item==='object'?item:{label:'指标',value:item}).filter(item=>isPresent(item.label)&&isPresent(item.value))}

function itemTitle(item,fb='分析结论'){if(typeof item!=='object')return fb;return item.title||item.label||item.name||item.type||item.category||item.badge||fb}

function itemBody(item){if(typeof item!=='object')return item;const values=[item.body,item.content,item.description,item.message,item.reason,item.suggestion,item.advice,item.handle_suggestion,item.recommendation,item.remark,item.value];for(const v of values){if(Array.isArray(v)){const joined=v.filter(isPresent).map(x=>typeof x==='object'?itemBody(x):x).filter(isPresent).join('；');if(isPresent(joined))return joined}else if(isPresent(v))return v}if(Array.isArray(item.suggestions)){const joined=item.suggestions.filter(isPresent).map(x=>typeof x==='object'?itemBody(x):x).filter(isPresent).join('；');if(isPresent(joined))return joined}return ''}

function hasDisplayContent(v){return isPresent(displayValue(v))}

function getCellValue(row,header,index){if(Array.isArray(row))return row[index];if(row&&typeof row==='object'){if(Object.prototype.hasOwnProperty.call(row,header))return row[header];const normalized=String(header).toLowerCase();const key=Object.keys(row).find(k=>k===header||fieldLabel(k)===header||String(k).toLowerCase()===normalized);if(key)return row[key];const vals=Object.keys(row).filter(k=>k!=='source').map(k=>row[k]).filter(isPresent);return vals[index]}return index===0?row:''}

function cleanTable(headers,rows){let hs=cleanArray(headers).map(String);const rs=cleanArray(rows);if(!hs.length&&rs.length&&rs[0]&&typeof rs[0]==='object'&&!Array.isArray(rs[0]))hs=Object.keys(rs[0]).filter(k=>k!=='source');if(!hs.length)return {headers:[],rows:[]};const matrix=rs.map(row=>hs.map((h,i)=>getCellValue(row,h,i))).filter(row=>row.some(hasDisplayContent));if(!matrix.length)return {headers:[],rows:[]};const keep=hs.map((h,i)=>matrix.some(row=>hasDisplayContent(row[i])));return {headers:hs.filter((h,i)=>keep[i]),rows:matrix.map(row=>row.filter((c,i)=>keep[i])).filter(row=>row.some(hasDisplayContent))}}

function renderTable(caption,headers,rows){const table=cleanTable(headers,rows);if(!table.rows.length||!table.headers.length)return '';return `<table class="data-table"><caption>${escapeHtml(caption)}</caption><thead><tr>${table.headers.map(h=>`<th>${escapeHtml(fieldLabel(h))}</th>`).join('')}</tr></thead><tbody>${table.rows.map(row=>`<tr>${row.map((cell,i)=>`<td>${text(displayValue(cell,table.headers[i]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`}

function numericKeys(list){return [...new Set(list.flatMap(row=>Object.keys(row).filter(k=>!['label','date','time','day','source','title','name','type'].includes(k)&&Number.isFinite(Number(row[k])))))].slice(0,5)}

function normalizeTrendRows(rows,title='趋势分析',chartType='line'){const list=cleanArray(rows).filter(x=>x&&typeof x==='object'&&!Array.isArray(x));if(list.length<2)return false;const keys=numericKeys(list);if(!keys.length)return false;return {title,type:chartType,labels:list.map((row,i)=>String(row.label||row.date||row.time||row.day||row.name||`样本${i+1}`)),datasets:keys.map((key,i)=>({key,label:fieldLabel(key),data:list.map(row=>Number.isFinite(Number(row[key]))?Number(row[key]):''),color:['#2d6a4f','#8b6914','#1f6f9f','#a0403b','#2f5f8f'][i%5]})),rows:list}}

function normalizeSeriesChart(chart,title='专项图表'){const labels=cleanArray(chart.labels||chart.xAxis||chart.categories).map(String);const rawSeries=cleanArray(chart.series||chart.datasets);if(!labels.length||!rawSeries.length)return false;const datasets=rawSeries.map((s,i)=>{const obj=typeof s==='object'?s:{name:`序列${i+1}`,data:s};const data=cleanArray(obj.data||obj.values).map(v=>Number.isFinite(Number(v))?Number(v):'');return {key:obj.key||obj.name||`s${i}`,label:obj.name||obj.label||`序列${i+1}`,data,color:['#2d6a4f','#8b6914','#1f6f9f','#a0403b','#2f5f8f'][i%5]}}).filter(ds=>ds.data.some(v=>v!==''));if(!datasets.length)return false;return {title:chart.title||title,type:chart.type||'line',labels,datasets}}

function chartFromTable(table,moduleName){const rows=cleanArray(table.rows).filter(x=>x&&typeof x==='object'&&!Array.isArray(x));if(rows.length<2)return false;const keys=numericKeys(rows);if(!keys.length)return false;const labelKey=Object.keys(rows[0]).find(k=>!keys.includes(k)&&isPresent(rows[0][k]))||'label';return {title:table.title||`${moduleName}分布图`,type:/分布|占比|等级|区域|结构/.test(String(table.title||''))?'bar':'line',labels:rows.map((row,i)=>String(row[labelKey]||`样本${i+1}`)),datasets:keys.slice(0,4).map((key,i)=>({key,label:fieldLabel(key),data:rows.map(row=>Number.isFinite(Number(row[key]))?Number(row[key]):''),color:['#2d6a4f','#8b6914','#1f6f9f','#a0403b'][i%4]}))}}

function extractCharts(report){const charts=[];const moduleName=moduleTypeName(report.type);[report.trendSeries,report.timeSeries,report.dailyData,report.rows,report.records].forEach((rows,i)=>{const c=normalizeTrendRows(rows,i?`${moduleName}趋势 ${i+1}`:`${moduleName}趋势`);if(c)charts.push(c)});cleanArray(report.charts).forEach(chart=>{const direct=normalizeSeriesChart(chart,chart.title||`${moduleName}图表`);if(direct)charts.push(direct);const c=normalizeTrendRows(chart.rows||chart.data||chart.points||chart.trendSeries,chart.title||`${moduleName}趋势`,chart.type||'line');if(c)charts.push(c)});cleanArray(report.tables).forEach(t=>{const c=chartFromTable(t,moduleName);if(c)charts.push(c)});return charts.filter((c,i,arr)=>arr.findIndex(x=>x.title===c.title)===i).slice(0,4)}

function topLevelCharts(){const charts=[];const biomass=normalizeTrendRows(REPORT_DATA.charts?.biomassTrend,'作物生长模拟 生长动态模型趋势');if(biomass)charts.push(biomass);return charts}

function renderMetrics(metrics){const items=metricItems(metrics).slice(0,12);if(!items.length)return '';return `<div class="metric-grid">${items.map(item=>`<div class="metric-card"><div class="metric-label">${text(item.label)}</div><div class="metric-value">${text(displayValue(item.value,item.label))}${item.unit?`<span style="font-size:13px;margin-left:3px">${escapeHtml(item.unit)}</span>`:''}</div>${item.sub||item.tag||item.level?`<div class="metric-sub">${text(displayValue(item.sub||item.tag||item.level,'level'))}</div>`:''}</div>`).join('')}</div>`}

function renderInsightItems(items){return cleanArray(items).slice(0,10).map(item=>{const obj=typeof item==='object'?item:{title:'分析结论',body:item};const title=itemTitle(obj,'分析结论');const body=itemBody(obj);if(!isPresent(title)&&!isPresent(body))return '';if(!isPresent(body))return '';return `<div class="insight-block ${levelClass(obj.level||obj.priority||obj.status)}"><div class="insight-title">${text(title)}</div><div>${text(displayValue(body))}</div></div>`}).filter(Boolean).join('')}

function renderModuleTables(report){return cleanArray(report.tables).slice(0,4).map(t=>renderTable(t.title||'专项数据表',cleanArray(t.headers).length?cleanArray(t.headers):[],cleanArray(t.rows))).join('')}

function renderSections(report){return cleanArray(report.sections).slice(0,5).map(s=>{const title=typeof s==='object'?s.title:'说明';const items=typeof s==='object'?cleanArray(s.items||s.children||s.points):[s];const html=items.map(x=>itemBody(x)||itemTitle(x,'')).filter(isPresent).map(x=>`<p>${text(x)}</p>`).join('');return html?`<h4>${text(title)}</h4>${html}`:''}).join('')}

function renderChartFigure(chart,id,caption){return `<div class="figure-wrapper"><div class="figure-caption">${escapeHtml(caption)}</div><div class="chart-container" id="${id}"></div></div>`}

function renderModuleReportSection(report,index){const title=report.title||moduleTypeName(report.type);const conclusion=report.conclusion||report.summary||report.overview||report.result||'当前专项数据未给出明确文字结论，以下内容基于已取得指标和趋势结构化展示。';const charts=extractCharts(report);const chartHtml=charts.map((chart,i)=>renderChartFigure(chart,`chart-${index}-${i}`,chart.title)).join('');const analysis=cleanArray(report.analysisItems||report.insights||report.findings||report.diagnosis);const risks=cleanArray(report.risks||report.warnings||report.alerts||report.abnormal);const suggestions=cleanArray(report.suggestions||report.recommendations||report.advice);const suggestionItems=suggestions.map(s=>itemBody(s)||itemTitle(s,'')).filter(isPresent);const link=safeUrl(report.link||report.reportUrl||report.report_url||report.url||report.file_url||report.pdf_url);return `<div class="module-divider"></div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(conclusion)}</p>${renderMetrics(report.metrics||report.kpis||report.index||report.keyMetrics)}${chartHtml}${renderInsightItems(analysis)}${renderSections(report)}${renderModuleTables(report)}${risks.length?`<h4>风险与异常解释</h4>${renderInsightItems(risks)}`:''}${suggestionItems.length?`<h4>专项建议</h4><ul class="recommendation-list">${suggestionItems.slice(0,8).map(s=>`<li>${text(s)}</li>`).join('')}</ul>`:''}${link?`<p class="muted">关联材料：<a href="${escapeHtml(link)}">查看专项报告</a></p>`:''}`}


function renderWeatherSection(){const weather=REPORT_DATA.weather||{};const now=weather.now||{};const forecast=cleanArray(weather.forecast);const currentRows=Object.entries(now).filter(([k,v])=>['temp','temperature','humidity','windSpeed','precip','precipitation','text','obsTime'].includes(k)&&isPresent(v)).map(([k,v])=>[({temp:'温度（℃）',temperature:'温度（℃）',humidity:'相对湿度（%）',windSpeed:'风速（km/h）',precip:'降水（mm）',precipitation:'降水（mm）',text:'天气',obsTime:'观测时间'})[k],v]);const forecastRows=forecast.map(r=>[r.date||r.fxDate,r.tempMin??r.tmin,r.tempMax??r.tmax,r.precip??r.precipitation,r.textDay||r.text||r.summary]).filter(r=>r.some(isPresent));if(!currentRows.length&&!forecastRows.length)return '';return `<h3>天气与作业窗口</h3>${currentRows.length?renderTable('当前天气', ['指标','记录'],currentRows):''}${forecastRows.length?renderTable('天气预报（以气象服务发布时间为准）',['日期','最低温（℃）','最高温（℃）','降水（mm）','天气'],forecastRows):''}`}

function renderWofostSection(){const w=REPORT_DATA.wofost||{};const k=cleanArray(w.kpis);const p=cleanArray(w.phenology);const b=cleanArray(w.waterBalance);if(!k.length&&!p.length&&!b.length)return '';const rows=xs=>xs.map(x=>[x.label||x.name||x.code,x.value,x.unit||x.description||x.sub||'']).filter(r=>r.some(isPresent));return `<h3>作物模型与水量收支</h3><p>以下为当前地块关联的作物生长模拟模型记录，物候日期、收获器官生物量和水量收支均属于模拟结果。</p>${k.length?renderTable('模型指标',['指标','数值','单位/说明'],rows(k)):''}${p.length?renderTable('模拟物候',['阶段','日期','说明'],rows(p)):''}${b.length?renderTable('模拟水量收支',['指标','数值','单位/说明'],rows(b)):''}`}


function renderStaticChart(dom,chart){
  // 外部图表库不可达时，仍以原始数值绘制矢量图；缺失值保留断点。
  const series=chart.datasets,labels=chart.labels,isBar=String(chart.type||'').toLowerCase()==='bar';
  const valid=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v));
  const values=series.flatMap(ds=>ds.data.filter(valid).map(Number));
  if(!values.length){dom.innerHTML='<div class="chart-fallback">暂无可绘制的有效数值。</div>';return}
  const width=760,height=340,left=70,right=20,top=52,bottom=52;
  let low=Math.min(...values),high=Math.max(...values);
  if(isBar){low=Math.min(0,low);high=Math.max(0,high)}
  const pad=(high-low||Math.abs(high)||1)*.08;low-=pad;high+=pad;
  const plotWidth=width-left-right,plotHeight=height-top-bottom;
  const x=i=>left+(i+.5)*plotWidth/Math.max(labels.length,1);
  const y=v=>top+(high-Number(v))*plotHeight/(high-low);
  const number=v=>Number(v.toPrecision(4)).toLocaleString('zh-CN',{maximumFractionDigits:4});
  let parts=[`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(chart.title)}" style="width:100%;height:100%;font:12px sans-serif"><title>${escapeHtml(chart.title)}</title>`];
  for(let tick=0;tick<=4;tick++){
    const value=low+(high-low)*tick/4,py=y(value);
    parts.push(`<line x1="${left}" y1="${py}" x2="${width-right}" y2="${py}" stroke="#e3e9e5"/><text x="${left-10}" y="${py+4}" text-anchor="end" fill="#627168">${number(value)}</text>`);
  }
  const stride=Math.max(1,Math.ceil(labels.length/7));
  labels.forEach((label,i)=>{if(i%stride===0||i===labels.length-1)parts.push(`<text x="${x(i)}" y="${height-bottom+22}" text-anchor="middle" fill="#627168">${escapeHtml(String(label))}</text>`)});
  series.forEach((ds,index)=>{
    const color=/^#[0-9a-f]{3,8}$/i.test(ds.color||'')?ds.color:['#2d6a4f','#8b6914','#1f6f9f','#a0403b'][index%4];
    const legendX=left+(index%3)*220,legendY=16+Math.floor(index/3)*18;
    parts.push(`<rect x="${legendX}" y="${legendY-9}" width="12" height="10" fill="${color}"/><text x="${legendX+18}" y="${legendY}" fill="#42544a">${escapeHtml(ds.label)}</text>`);
    let path='';
    ds.data.forEach((value,i)=>{
      if(!valid(value)){if(path){parts.push(`<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>`);path=''}return}
      const px=x(i),py=y(value),hint=escapeHtml(`${labels[i]} · ${ds.label}：${number(Number(value))}`);
      if(isBar){const barWidth=plotWidth/Math.max(labels.length,1)*.72/series.length;parts.push(`<rect x="${px+(index-series.length/2)*barWidth}" y="${Math.min(py,y(0))}" width="${barWidth}" height="${Math.max(Math.abs(y(0)-py),.5)}" fill="${color}"><title>${hint}</title></rect>`)}
      else{path+=`${path?'L':'M'}${px},${py} `}
    });
    if(path)parts.push(`<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>`);
  });
  parts.push('</svg>');dom.innerHTML=parts.join('');
}

function renderAcademicChart(id,chart){const dom=document.getElementById(id);if(!dom||!chart)return;if(!window.echarts){renderStaticChart(dom,chart);return}const isBar=String(chart.type||'').toLowerCase()==='bar';const option={tooltip:{trigger:'axis'},legend:{top:0,textStyle:{fontFamily:'PingFang SC'}},grid:{left:52,right:28,top:48,bottom:42},xAxis:{type:'category',data:chart.labels,axisLabel:{fontFamily:'PingFang SC'}},yAxis:{type:'value',axisLabel:{fontFamily:'PingFang SC'}},series:chart.datasets.map(ds=>({name:ds.label,type:isBar?'bar':'line',smooth:!isBar,showSymbol:!isBar?false:true,data:ds.data,lineStyle:{width:2,color:ds.color},itemStyle:{color:ds.color},areaStyle:isBar?void 0:{opacity:.08}}))};echarts.init(dom).setOption(option)}

function renderAllCharts(){topLevelCharts().forEach((chart,i)=>renderAcademicChart(`top-chart-${i}`,chart));getModules().forEach((m,index)=>extractCharts(m).forEach((chart,i)=>renderAcademicChart(`chart-${index+1}-${i}`,chart)))}
window.addEventListener('resize',()=>{if(window.echarts)document.querySelectorAll('.chart-container').forEach(dom=>{const chart=echarts.getInstanceByDom(dom);if(chart)chart.resize()})});
const CHAPTERS = [
  ['crop','地块边界与作物识别','分析边界、分类候选和时序输入按本地块冻结结果展示。'],
  ['remote','遥感植被与观测变化','以观测日期、像元尺度和产品来源解释植被信号。'],
  ['risk','异常分布与风险分析','用位置、编号与指标解释异常候选；风险信号保留实际分析方法。'],
  ['environment','气象与土壤条件','格点天气与土壤参考提供环境背景，保留来源、尺度及有效日期。'],
  ['growth','生育进程与长势综合评价','生育、冠层、生物量和水分按实际模拟或预测日期展示。'],
  ['production','产量与品质预测','只展示已发布指标，明确区分干物质、商品鲜产量和品质结果。'],
  ['management','管理价值与建议','用位置、时段和分析结果组织关注项，经营数值以实际记录为依据。'],
];
const TOPICS = {
  '农田分割与作物识别':'crop','遥感植被状态':'remote','卫星观测与影像来源':'remote','历史长势分析':'remote',
  '气象条件与降水过程':'environment','土壤基础与养分参考':'environment',
  '异常识别与巡查':'risk','病虫害分析':'risk','气候灾害分析':'risk',
  '生育进程与水分状态':'growth','长势综合评价':'growth','产量与品质预测':'production','专项分析结果':'methods',
};

function contextData(){
  const node=document.getElementById('canonical-results-template').content.querySelector('#survey-framework-context');
  return node ? JSON.parse(node.content.textContent) : {};
}
function element(tag,classes='',content=''){
  const node=document.createElement(tag);node.className=classes;node.textContent=content;return node;
}
function addText(parent,tag,content,classes=''){
  if(content!==undefined&&content!==null&&content!=='')parent.append(element(tag,classes,String(content).replace(/WOFOST/gi,'作物生长模拟')));
}
function chapter(key,title,lead){
  const node=element('section','chapter survey-report');node.id=key;
  node.append(element('h2','',title),element('p','lead',lead));return node;
}
function renderCover(context,groups){
  const node=element('header','cover');node.id='overview';
  const subject=meta().plotName||meta().subjectName||context.name||'目标地块';
  document.title=subject+' · 地块勘察综合分析报告';
  node.append(element('p','eyebrow','地块综合分析'),element('h1','','地块勘察综合分析报告'));
  const cutoff=context.as_of||meta().reportDate||'未提供';
  const period=[context.start_date||meta().periodStart,context.end_date||meta().periodEnd].filter(Boolean).join(' 至 ');
  node.append(element('p','cover-meta',subject+' · 报告截止 '+cutoff+(period?(context.reference_year?' · 当季参考期 ':' · 参考时段 ')+period:'')));
  if(context.reference_year){const source=context.observation_period||{};const window=[source.start_date,source.end_date].filter(Boolean).join(' 至 ');node.append(element('p','cover-meta','主分析年度 '+context.reference_year+(window?' · 观测范围 '+window:' · 观测不足')))}
  const grid=element('div','cover-grid'),map=element('div'),findings=element('div','findings');
  const image=[...groups.risk.querySelectorAll('figure')].find(x=>x.querySelector('svg'))
    ||[...groups.crop.querySelectorAll('figure')].find(x=>x.querySelector('svg'));
  if(image)map.append(image.cloneNode(true));else map.append(element('p','source-note','当前冻结成果没有可用影像或空间图。'));
  findings.append(element('h2','','主要发现'));
  const paper=REPORT_DATA.paper||{};
  const authored=cleanArray(paper.findings).length?cleanArray(paper.findings):cleanArray(paper.conclusions);
  const items=context.findings||authored.map(x=>({title:itemTitle(x,''),body:itemBody(x)}));
  for(const item of items.slice(0,3)){
    const p=element('p');p.append(element('b','',item.title||''));addText(p,'span',item.body);findings.append(p);
  }
  grid.append(map,findings);node.append(grid);
  const metrics=element('dl','metrics');
  for(const item of context.metrics||[]){const cell=element('div');cell.append(element('dt','',item.label),element('dd','',item.value),element('small','',item.detail));metrics.append(cell);}
  if(metrics.children.length)node.append(metrics);
  node.append(element('p','source-note','来源、日期与分析性质在各章节标明；缺失指标保留状态，不作数值推断。'));
  return node;
}
function collectCanonical(groups){
  const source=document.getElementById('canonical-results-template').content;
  for(const root of [...source.children].filter(node=>node.matches('.survey-report'))){
    let target=groups.methods;
    for(const original of root.children){
      if(original.matches('style,header.survey-title'))continue;
      if(original.tagName==='H3')target=groups[TOPICS[original.textContent.trim()]||'methods'];
      if(original.tagName==='DETAILS'&&/版本/.test(original.querySelector('summary')?.textContent||''))target=groups.methods;
      const cloned=original.cloneNode(true);
      target.append(cloned);
    }
  }
}
function addManagement(context,group){
  if(context.economic_note)group.append(element('h3','','经营记录与经济价值'),element('p','',context.economic_note));
}
function addBusinessData(groups){
  const basics=metricItems(REPORT_DATA.overview?.kpis);
  if(basics.length){
    groups.crop.append(element('h3','','地块基础指标'),element('p','survey-source','基础指标的来源和有效日期以记录说明为准。'));
    groups.crop.insertAdjacentHTML('beforeend',renderMetrics(basics));
  }
  const plots=cleanArray(REPORT_DATA.plots);
  if(plots.length)groups.crop.insertAdjacentHTML('beforeend',renderTable('地块与种植记录',['地块','作物','阶段'],plots.map(p=>[p.name,p.crop,p.stage])));
  getModules().forEach((module,index)=>{
    const key=['plot_growth_dynamics','plot_growth_analysis'].includes(module.type)?'growth':'crop';
    groups[key].insertAdjacentHTML('beforeend',renderModuleReportSection(module,index+1));
  });
  groups.environment.insertAdjacentHTML('beforeend',renderWeatherSection());
  groups.growth.insertAdjacentHTML('beforeend',renderWofostSection());
  topLevelCharts().forEach((chart,index)=>groups.growth.insertAdjacentHTML('beforeend',renderChartFigure(chart,`top-chart-${index}`,chart.title)));
  const paper=REPORT_DATA.paper||{};
  if(paper.abstract){groups.management.append(element('h3','','综合解读'));addText(groups.management,'p',paper.abstract);}
  if(cleanArray(paper.discussion).length){groups.management.append(element('h3','','管理分析'));for(const item of paper.discussion)addText(groups.management,'p',itemBody(item));}
  const recommendations=cleanArray(REPORT_DATA.recommendations);
  if(recommendations.length){groups.management.append(element('h3','','管理建议'));for(const item of recommendations){const p=element('p');p.append(element('b','',itemTitle(item,'建议')+'：'));addText(p,'span',itemBody(item));groups.management.append(p);}}
  for(const [key,title] of [['findings','综合分析'],['conclusions','管理结论']]){
    const items=cleanArray(paper[key]);
    if(items.length){groups.management.append(element('h3','',title));for(const item of items)addText(groups.management,'p',typeof item==='string'?item:itemBody(item));}
  }
  const sources=cleanArray(meta().dataSources);
  if(sources.length){groups.methods.append(element('h3','','数据来源'));addText(groups.methods,'p',sources.join('、'));}
  groups.management.insertAdjacentHTML('beforeend',renderInsightItems(REPORT_DATA.plotWarnings));
  for(const method of cleanArray(paper.methods))addText(groups.methods,'p',typeof method==='string'?method:itemBody(method));
  // 同类分析限制合为一段，避免打印时末尾短句单独成页；不删减原说明。
  addText(groups.methods,'p',cleanArray(paper.limitations).map(limit=>typeof limit==='string'?limit:itemBody(limit)).filter(Boolean).join(' '));
  for(const link of cleanArray(paper.appendixLinks)){const url=safeUrl(typeof link==='string'?link:link.url);if(url){const p=element('p'),a=element('a','','查看关联材料');a.href=url;p.append(a);groups.methods.append(p);}}
}
function initializeFramework(){
  const context=contextData(),groups={};
  for(const [key,title,lead] of CHAPTERS)groups[key]=chapter(key,title,lead);
  groups.methods=element('div','survey-report');
  collectCanonical(groups);addBusinessData(groups);
  const map=[...groups.crop.querySelectorAll('figure')].find(x=>x.querySelector('svg'));
  addManagement(context,groups.management);
  const paper=document.getElementById('paper-root');paper.append(renderCover(context,groups));
  for(const [key] of CHAPTERS)paper.append(groups[key]);
  const appendix=element('section','chapter appendix');appendix.id='methods';
  const details=document.createElement('details');details.append(element('summary','','数据与方法'),groups.methods);appendix.append(details);paper.append(appendix);
  const footer=element('footer','footer','地块勘察综合分析报告 · 来源与性质按章节标明');paper.append(footer);
  const navigation=document.querySelector('nav');
  for(const [key,label] of [['overview','地块概览'],['crop','边界与识别'],['remote','遥感与变化'],['risk','异常与风险'],['environment','气象与土壤'],['growth','生育与长势'],['production','产量与品质'],['management','管理价值']]){const a=element('a','',label);a.href='#'+key;navigation.append(a);}
  document.getElementById('print-report').addEventListener('click',()=>window.print());
  let wasOpen=false;
  window.addEventListener('beforeprint',()=>{wasOpen=details.open;details.open=true;});
  window.addEventListener('afterprint',()=>{details.open=wasOpen;});
  const links=[...navigation.querySelectorAll('a')];
  const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)links.forEach(a=>a.classList.toggle('active',a.hash==='#'+entry.target.id));}),{rootMargin:'-122px 0px -65% 0px'});
  document.querySelectorAll('.chapter,#overview').forEach(node=>observer.observe(node));
  renderAllCharts();
}
initializeFramework();

</script></body></html>
