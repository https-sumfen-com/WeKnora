<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SONO 学术报告</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{--primary:#1a3c2a;--primary-light:#eaf2ec;--accent:#8b6914;--danger:#a0403b;--warning:#b5761b;--success:#2d6a4f;--info:#2f5f8f;--text:#1a1a1a;--text-secondary:#4a4a4a;--text-muted:#6b7280;--border:#d4d4d4;--bg-page:#fdfdfd;--bg-table-header:#f5f6f8;--shadow-md:0 4px 16px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"CMU Serif","Noto Serif CJK SC","Source Han Serif CN","Songti SC","STSong","Times New Roman",serif;color:var(--text);background:#e8ece9;line-height:1.9;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.report-toolbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid #dfe6e2;box-shadow:0 2px 10px rgba(0,0,0,.06)}.toolbar-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.toolbar-title{font-size:13px;color:var(--text-secondary);letter-spacing:.5px}.export-pdf-button{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:4px;padding:7px 14px;font-size:13px;cursor:pointer;letter-spacing:.5px}.export-pdf-button:hover{background:#10291d}
.title-page{background:#fefefe;min-height:100vh;display:flex;align-items:center;justify-content:center;page-break-after:always;position:relative;border-bottom:2px solid var(--primary)}
.title-page::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--primary)}.title-page::after{content:"";position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:120px;height:1px;background:var(--accent)}
.title-content{text-align:center;max-width:760px;padding:60px 40px}.title-overline{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:32px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title-content h1{font-size:34px;font-weight:700;line-height:1.4;letter-spacing:1px;margin-bottom:12px;color:#111}.title-content .subtitle{font-size:16px;color:var(--text-secondary);font-style:italic;margin-bottom:48px}.title-divider{width:60px;height:2px;background:var(--primary);margin:0 auto 40px}.title-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;text-align:center;font-size:13px;color:var(--text-muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif}.info-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:6px;color:#999}.info-value{font-size:14px;color:var(--text);font-weight:500}.title-footer{position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:11px;color:#aaa;letter-spacing:2px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.paper-container{max-width:960px;margin:0 auto;background:var(--bg-page);box-shadow:var(--shadow-md);counter-reset:table-counter figure-counter}.section{padding:56px 80px;page-break-after:always;border-bottom:1px solid #eee}.section:last-child{border-bottom:none}.section-number{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--text-muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif;margin-bottom:6px}.section h2{font-size:24px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;color:#111}.section h3{font-size:17px;font-weight:600;margin:36px 0 14px;color:var(--primary);padding-bottom:6px;border-bottom:1px solid #e5e5e5}.section h4{font-size:14px;font-weight:600;margin:24px 0 10px;color:var(--text-secondary)}
.abstract-box{background:#fafcfa;border:1px solid #dce5dd;padding:24px 28px;margin:20px 0 28px;font-size:14px;line-height:1.85}.abstract-label{font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--primary);display:block;margin-bottom:10px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.keywords{margin-top:14px;font-size:12px;color:var(--text-muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif}.keywords span{background:#eef3ef;padding:3px 10px;margin:0 4px 6px 0;border-radius:3px;font-size:11px;display:inline-block}.finding-box{background:#fdf8f0;border-left:4px solid var(--accent);padding:18px 22px;margin:20px 0 28px;font-size:14px}.finding-box strong{color:var(--accent)}
.data-table{width:100%;border-collapse:collapse;margin:18px 0 26px;font-size:13px}.data-table caption{caption-side:top;text-align:left;font-weight:700;font-size:13px;margin-bottom:8px;color:var(--text-secondary)}.data-table caption::before{counter-increment:table-counter;content:"表 " counter(table-counter) "  ";color:var(--primary)}.data-table th{background:var(--bg-table-header);font-weight:600;color:var(--text-secondary);border:1px solid var(--border);padding:10px 12px;text-align:left}.data-table td{border:1px solid var(--border);padding:9px 12px;vertical-align:top}.data-table tr:nth-child(even) td{background:#fafafa}
.figure-wrapper{margin:28px 0 32px;page-break-inside:avoid}.figure-caption{font-size:13px;text-align:center;color:var(--text-secondary);margin-bottom:12px;font-weight:600}.figure-caption::before{counter-increment:figure-counter;content:"图 " counter(figure-counter) "  ";color:var(--primary)}.chart-container{width:100%;height:380px;border:1px solid #e5e5e5;background:#fff;padding:12px}.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.chart-row .chart-container{height:320px}.chart-fallback{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text-muted);font-size:13px;padding:20px;text-align:center}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 26px}.metric-card{border:1px solid var(--border);background:#fff;padding:14px 16px}.metric-label{font-size:12px;color:var(--text-muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif}.metric-value{font-size:22px;font-weight:700;color:var(--primary);line-height:1.35}.metric-sub{font-size:11px;color:var(--text-muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.insight-block{border-left:3px solid var(--primary);padding:12px 16px;background:#f8faf8;margin:14px 0}.insight-block.warn{border-left-color:var(--warning);background:#fff8ec}.insight-block.danger{border-left-color:var(--danger);background:#fff5f5}.insight-block.info{border-left-color:var(--info);background:#f3f7fb}.insight-title{font-weight:700;color:var(--primary);margin-bottom:4px}.insight-block.warn .insight-title{color:var(--warning)}.insight-block.danger .insight-title{color:var(--danger)}.insight-block.info .insight-title{color:var(--info)}.recommendation-list{list-style:none;margin:18px 0}.recommendation-list li{position:relative;padding:12px 0 12px 36px;border-bottom:1px solid #eee}.recommendation-list li::before{content:"→";position:absolute;left:8px;color:var(--accent);font-weight:700}.conclusion-list{counter-reset:conclusion;list-style:none;margin:20px 0}.conclusion-list li{counter-increment:conclusion;position:relative;padding:12px 0 12px 48px;border-bottom:1px solid #eee}.conclusion-list li::before{content:counter(conclusion);position:absolute;left:0;top:12px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;text-align:center;line-height:28px;font-weight:700;font-size:13px}.disclaimer{background:#f8f8f8;border:1px solid #e5e5e5;padding:18px 22px;margin-top:24px;font-size:12px;color:var(--text-muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}.link-list{list-style:none;margin:12px 0}.link-list a{color:var(--primary);text-decoration:none;border-bottom:1px solid var(--primary)}.muted{color:var(--text-muted)}.module-divider{border-top:1px solid #e5e5e5;margin:34px 0 8px}.missing-module{color:var(--text-muted);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px}
@media print{body{background:white}.report-toolbar{display:none}.title-page{min-height:297mm}.paper-container{box-shadow:none;max-width:none}.section{padding:32px 40px;page-break-after:auto}.chart-container{break-inside:avoid}.figure-wrapper,.data-table{break-inside:avoid}}
@media(max-width:768px){.section{padding:28px 18px}.title-info,.chart-row{grid-template-columns:1fr}.title-content h1{font-size:26px}.chart-container{height:300px}.toolbar-inner{padding:8px 12px}.toolbar-title{display:none}}
</style>

<body>
<div class="report-toolbar"><div class="toolbar-inner"><div class="toolbar-title">SONO 地块学术报告</div><button class="export-pdf-button" type="button" onclick="window.print()">导出 PDF</button></div></div>
<div id="title-root"></div>
<main class="paper-container" id="paper-root"></main>
<script>
const REPORT_DATA = /* __REPORT_DATA__ */ {
  meta: { plotName: '', subjectName: '', reportDate: '', generatedAt: '', reportType: '', reportSubtype: '' },
  paper: { abstract: '', keywords: [], methods: [], findings: [], discussion: [], conclusions: [], limitations: [], appendixLinks: [] },
  overview: { kpis: [] },
  charts: { biomassTrend: [] },
  weather: { now: {}, forecast: [], alerts: [] },
  plotWarnings: [],
  plots: [],
  devices: { summary: {}, items: [] },
  wofost: { phenology: [], kpis: [], waterBalance: [], links: {} },
  moduleReports: [],
  recommendations: [],
  emptyStates: []
};

const MODULE_INFO={
  plot_growth_analysis:{name:'长势分析',title:'农业遥感与作物长势定量分析报告',subtitle:'Quantitative Assessment of Crop Growth Vigor Using Remote-Sensing Indicators',keywords:['长势分析','NDVI','LAI','覆盖度','农事建议'],method:'综合 NDVI、LAI、覆盖度、长势等级及异常区域等指标，对地块长势状态和阶段变化进行定量分析。'},
  plot_3d_phenotype:{name:'三维表型',title:'作物三维表型结构与空间异质性分析报告',subtitle:'Three-Dimensional Phenotyping and Spatial Heterogeneity Assessment',keywords:['三维表型','株高','冠层','生物量','空间异质性'],method:'利用株高、冠层覆盖、LAI、生物量及三维重建结论，评估作物表型结构及空间差异。'},
  plot_growth_dynamics:{name:'生长动态',title:'作物生长动态模型模拟分析报告',subtitle:'WOFOST-Based Crop Growth Dynamics and Biomass Simulation Report',keywords:['WOFOST','模型模拟','DVS','LAI','TAGP','土壤水分'],method:'基于 WOFOST 日序列模型数据，分析生育进程、冠层变化、生物量积累、水分过程与氮素吸收。'},
  plot_seedling_monitoring:{name:'苗情监控',title:'苗情监测与建群质量评估报告',subtitle:'Seedling Establishment Monitoring and Stand Quality Assessment',keywords:['苗情监控','出苗率','苗密度','整齐度','缺苗风险'],method:'围绕出苗率、苗数/密度、整齐度、缺苗断垄及补苗建议，对苗期建群质量进行评估。'},
  overall_report:{name:'整体报告',title:'地块综合生长监测与多源专项分析报告',subtitle:'Integrated Multi-Module Crop Growth Monitoring and Agronomic Assessment',keywords:['长势分析','三维表型','生长动态','苗情监控','综合评估'],method:'整合长势分析、三维表型、生长动态与苗情监控四类证据，形成跨模块综合研判。'}
};
const MODULE_ORDER=['plot_growth_analysis','plot_3d_phenotype','plot_growth_dynamics','plot_seedling_monitoring'];
const DISPLAY_SOURCE={'plot-info':'地块基础信息','plot-warning':'地块风险预警','weather':'气象与作业窗口','report-by-type':'专项分析结果'};
const BAD_TEXT=new Set(['','nan','none','nil','n/a','--','-','—','无','暂无','未提供'].concat(['n'+'ull','un'+'defined']));
function isPresent(v){if(v==void 0)return false;if(typeof v==='number')return Number.isFinite(v);if(typeof v==='boolean')return true;if(typeof v==='string')return !BAD_TEXT.has(v.trim().toLowerCase());if(Array.isArray(v))return v.some(isPresent);if(typeof v==='object')return Object.values(v).some(isPresent);return true}
function cleanArray(v){return Array.isArray(v)?v.filter(isPresent):[]}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtNumber(v,d=2){if(!isPresent(v))return '';const n=Number(v);if(!Number.isFinite(n))return escapeHtml(v);return n.toFixed(d).replace(/\.0+$|(?<=\.\d*[1-9])0+$/,'')}
function text(v,fallback='—'){return isPresent(v)?escapeHtml(v):fallback}
function safeUrl(v){if(!isPresent(v))return '';try{const u=new URL(String(v));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function meta(){return REPORT_DATA.meta||{}}
function subtype(){const m=meta();return m.reportSubtype||m.report_type||(m.reportType==='plot_overall_report'?'overall_report':'')}
function isOverall(){return subtype()==='overall_report'||meta().reportType==='plot_overall_report'}
function reportInfo(){const st=subtype();return MODULE_INFO[st]||MODULE_INFO.overall_report}
function plotName(){const m=meta();return m.plotName||m.subjectName||cleanArray(REPORT_DATA.plots)[0]?.name||'目标地块'}
function moduleTypeName(type){return (MODULE_INFO[type]&&MODULE_INFO[type].name)||String(type||'专项分析').replace(/_/g,' ')}
function levelClass(level){const s=String(level||'').toLowerCase();if(/red|danger|high|高|严重/.test(s))return 'danger';if(/amber|warn|mid|medium|中|风险|注意/.test(s))return 'warn';if(/blue|info|gray|grey|关注|信息/.test(s))return 'info';return ''}
function levelText(value){const s=String(value||'').trim().toLowerCase();if(!s)return '';if(/red|danger|high|高|严重/.test(s))return '高风险 / 需优先处置';if(/amber|warn|mid|medium|中|风险|注意/.test(s))return '需关注';if(/green|good|normal|low|正常|良好/.test(s))return '正常';if(/blue|info/.test(s))return '关注指标';if(/gray|grey/.test(s))return '信息项';return String(value)}
function displayValue(v,key=''){if(!isPresent(v))return '';const k=String(key||'').toLowerCase();if(['level','status','state','priority','tag','badge','说明'].some(x=>k.includes(x)))return levelText(v);const raw=String(v).trim();if(/^(red|green|blue|amber|gray|grey|warn|danger)$/i.test(raw))return levelText(raw);return raw}
function fieldLabel(key){return {label:'样本',date:'日期',time:'时间',day:'模型日',dvs:'DVS',lai:'LAI',tagp:'TAGP',twso:'TWSO',wso:'WSO',wlv:'WLV',wst:'WST',wrt:'WRT',soilMoisture:'SM',sm:'SM',rd:'RD',nUptakeTotal:'氮素吸收',ndvi:'NDVI',coverage:'覆盖度',fvc:'FVC',height:'株高',plantHeight:'株高',biomass:'生物量',density:'苗密度',emergenceRate:'出苗率',uniformity:'整齐度',area:'面积',ratio:'占比',level:'等级',status:'状态'}[key]||String(key).replace(/_/g,' ')}
function periodText(){const m=meta();const parts=[m.periodStart,m.periodEnd].filter(isPresent);if(parts.length===2)return parts.join(' 至 ');const dates=cleanArray(REPORT_DATA.moduleReports).flatMap(r=>[r.startDate,r.endDate,r.reportDate,r.date]).filter(isPresent);return parts[0]||dates.slice(0,2).join(' 至 ')||m.reportDate||'当前报告期'}
function getModules(){const mods=cleanArray(REPORT_DATA.moduleReports).filter(r=>r&&typeof r==='object');const st=subtype();if(isOverall())return mods.filter(r=>MODULE_ORDER.includes(r.type)).sort((a,b)=>MODULE_ORDER.indexOf(a.type)-MODULE_ORDER.indexOf(b.type));if(MODULE_ORDER.includes(st))return mods.filter(r=>r.type===st);return mods}
function moduleMap(){const map={};getModules().forEach(m=>{map[m.type]=m});return map}
function metricItems(values){return cleanArray(values).map(item=>typeof item==='object'?item:{label:'指标',value:item}).filter(item=>isPresent(item.label)&&isPresent(item.value))}
function sourceLabel(value){const raw=String(value||'');if(raw.indexOf('report_by_type:')>0)return moduleTypeName(raw.split(':')[1]);const key=raw.replace(/^get_/,'').replace(/_/g,'-');return DISPLAY_SOURCE[key]||key.replace(/-/g,' ')}
function itemTitle(item,fb='分析结论'){if(typeof item!=='object')return fb;return item.title||item.label||item.name||item.type||item.category||item.badge||fb}
function itemBody(item){if(typeof item!=='object')return item;const values=[item.body,item.content,item.description,item.message,item.reason,item.suggestion,item.advice,item.handle_suggestion,item.recommendation,item.remark,item.value];for(const v of values){if(Array.isArray(v)){const joined=v.filter(isPresent).map(x=>typeof x==='object'?itemBody(x):x).filter(isPresent).join('；');if(isPresent(joined))return joined}else if(isPresent(v))return v}if(Array.isArray(item.suggestions)){const joined=item.suggestions.filter(isPresent).map(x=>typeof x==='object'?itemBody(x):x).filter(isPresent).join('；');if(isPresent(joined))return joined}return ''}
function renderTitlePage(){const info=reportInfo();const m=meta();const title=m.title&&m.title!=='地块报告'?m.title:`${plotName()}${info.name==='整体报告'?'综合生长监测与分析报告':info.name+'报告'}`;document.title=title;document.getElementById('title-root').innerHTML=`<section class="title-page"><div class="title-content"><div class="title-overline">SONO AGRONOMIC TECHNICAL REPORT</div><h1>${escapeHtml(title)}</h1><div class="subtitle">${escapeHtml(info.subtitle)}</div><div class="title-divider"></div><div class="title-info"><div><span class="info-label">Monitoring Object</span><span class="info-value">${text(plotName())}</span></div><div><span class="info-label">Observation Period</span><span class="info-value">${text(periodText())}</span></div><div><span class="info-label">Report Date</span><span class="info-value">${text(m.reportDate)}</span></div></div></div><div class="title-footer">AI AGRICULTURAL DECISION SUPPORT · EVIDENCE-BASED REPORT</div></section>`}
function section(num,title,body){return `<section class="section"><div class="section-number">§ ${num}</div><h2>${escapeHtml(title)}</h2>${body}</section>`}
function renderAbstract(){const p=REPORT_DATA.paper||{};const info=reportInfo();const mods=getModules();const conclusions=mods.map(m=>m.conclusion||m.summary||m.overview||m.result).filter(isPresent);let core='当前报告依据已取得的地块真实业务数据形成判断，未取得的数据不作推断。';if(conclusions.length){core=isOverall()?`四类专项中已取得 ${conclusions.length} 类有效结论：${conclusions.slice(0,4).join('；')}`:`核心结果显示：${conclusions[0]}`}
const abstract=p.abstract||`本报告以 ${plotName()} 为研究对象，围绕${info.name}开展结构化分析。报告综合地块基础信息、专项指标、时序趋势、风险项与农事建议，采用描述统计、趋势比较和异常识别等方法，对当前可取得的证据进行归纳。${core} 报告结论用于辅助生产决策，建议结合现场巡查、天气窗口和农技规范复核。`;
const keywords=cleanArray(p.keywords).length?cleanArray(p.keywords):info.keywords;return section(1,'摘 要',`<div class="abstract-box"><span class="abstract-label">Abstract</span><p>${escapeHtml(abstract)}</p><div class="keywords"><strong>关键词：</strong>${keywords.map(k=>`<span>${escapeHtml(k)}</span>`).join('')}</div></div>`) }
function hasDisplayContent(v){return isPresent(displayValue(v))}
function getCellValue(row,header,index){if(Array.isArray(row))return row[index];if(row&&typeof row==='object'){if(Object.prototype.hasOwnProperty.call(row,header))return row[header];const normalized=String(header).toLowerCase();const key=Object.keys(row).find(k=>k===header||fieldLabel(k)===header||String(k).toLowerCase()===normalized);if(key)return row[key];const vals=Object.keys(row).filter(k=>k!=='source').map(k=>row[k]).filter(isPresent);return vals[index]}return index===0?row:''}
function cleanTable(headers,rows){let hs=cleanArray(headers).map(String);const rs=cleanArray(rows);if(!hs.length&&rs.length&&rs[0]&&typeof rs[0]==='object'&&!Array.isArray(rs[0]))hs=Object.keys(rs[0]).filter(k=>k!=='source');if(!hs.length)return {headers:[],rows:[]};const matrix=rs.map(row=>hs.map((h,i)=>getCellValue(row,h,i))).filter(row=>row.some(hasDisplayContent));if(!matrix.length)return {headers:[],rows:[]};const keep=hs.map((h,i)=>matrix.some(row=>hasDisplayContent(row[i])));return {headers:hs.filter((h,i)=>keep[i]),rows:matrix.map(row=>row.filter((c,i)=>keep[i])).filter(row=>row.some(hasDisplayContent))}}
function renderTable(caption,headers,rows){const table=cleanTable(headers,rows);if(!table.rows.length||!table.headers.length)return '';return `<table class="data-table"><caption>${escapeHtml(caption)}</caption><thead><tr>${table.headers.map(h=>`<th>${escapeHtml(fieldLabel(h))}</th>`).join('')}</tr></thead><tbody>${table.rows.map(row=>`<tr>${row.map((cell,i)=>`<td>${text(displayValue(cell,table.headers[i]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function renderMethods(){const m=meta();const kpis=cleanArray(REPORT_DATA.overview?.kpis);const plots=cleanArray(REPORT_DATA.plots);const methods=cleanArray(REPORT_DATA.paper?.methods);const dataSources=cleanArray(m.dataSources).map(sourceLabel).filter(isPresent);const plotRows=[['地块名称',plotName()],['报告类型',reportInfo().name],['观测期',periodText()],['作物/阶段',plots.map(p=>[p.crop,p.stage].filter(isPresent).join(' / ')).filter(isPresent).join('；')||'按已取得地块信息展示']];const indicatorRows=kpis.slice(0,10).map(k=>[k.label,[k.value,k.unit].filter(isPresent).join(' '),displayValue(k.tag||k.level||k.status||k.sub,'level')]).filter(r=>r.some(isPresent));const sourceRows=(dataSources.length?dataSources:['地块基础信息','专项分析结果']).map(s=>[s,'结构化业务数据','用于指标提取、趋势分析与风险研判']);const methodText=methods.length?methods.map(x=>`<p>${escapeHtml(typeof x==='string'?x:(itemBody(x)||itemTitle(x,'')))}</p>`).join(''):`<p>${escapeHtml(reportInfo().method)}</p><p>所有结论均基于当前输入的结构化数据与专项报告结果生成；未在数据中出现的具体数值、阈值或因果关系不作扩展推断。</p>`;return section(2,'数据来源与处理方法',`${methodText}${renderTable('监测对象与报告范围', ['项目','内容'], plotRows)}${indicatorRows.length?renderTable('地块基础指标摘要', ['指标','数值','说明'], indicatorRows):''}${renderTable('数据来源与分析用途', ['数据类别','数据形态','用途'], sourceRows)}`)}
function numericKeys(list){return [...new Set(list.flatMap(row=>Object.keys(row).filter(k=>!['label','date','time','day','source','title','name','type'].includes(k)&&Number.isFinite(Number(row[k])))))].slice(0,5)}
function normalizeTrendRows(rows,title='趋势分析',chartType='line'){const list=cleanArray(rows).filter(x=>x&&typeof x==='object'&&!Array.isArray(x));if(list.length<2)return false;const keys=numericKeys(list);if(!keys.length)return false;return {title,type:chartType,labels:list.map((row,i)=>String(row.label||row.date||row.time||row.day||row.name||`样本${i+1}`)),datasets:keys.map((key,i)=>({key,label:fieldLabel(key),data:list.map(row=>Number.isFinite(Number(row[key]))?Number(row[key]):''),color:['#2d6a4f','#8b6914','#1f6f9f','#a0403b','#2f5f8f'][i%5]})),rows:list}}
function normalizeSeriesChart(chart,title='专项图表'){const labels=cleanArray(chart.labels||chart.xAxis||chart.categories).map(String);const rawSeries=cleanArray(chart.series||chart.datasets);if(!labels.length||!rawSeries.length)return false;const datasets=rawSeries.map((s,i)=>{const obj=typeof s==='object'?s:{name:`序列${i+1}`,data:s};const data=cleanArray(obj.data||obj.values).map(v=>Number.isFinite(Number(v))?Number(v):'');return {key:obj.key||obj.name||`s${i}`,label:obj.name||obj.label||`序列${i+1}`,data,color:['#2d6a4f','#8b6914','#1f6f9f','#a0403b','#2f5f8f'][i%5]}}).filter(ds=>ds.data.some(v=>v!==''));if(!datasets.length)return false;return {title:chart.title||title,type:chart.type||'line',labels,datasets}}
function chartFromTable(table,moduleName){const rows=cleanArray(table.rows).filter(x=>x&&typeof x==='object'&&!Array.isArray(x));if(rows.length<2)return false;const keys=numericKeys(rows);if(!keys.length)return false;const labelKey=Object.keys(rows[0]).find(k=>!keys.includes(k)&&isPresent(rows[0][k]))||'label';return {title:table.title||`${moduleName}分布图`,type:/分布|占比|等级|区域|结构/.test(String(table.title||''))?'bar':'line',labels:rows.map((row,i)=>String(row[labelKey]||`样本${i+1}`)),datasets:keys.slice(0,4).map((key,i)=>({key,label:fieldLabel(key),data:rows.map(row=>Number.isFinite(Number(row[key]))?Number(row[key]):''),color:['#2d6a4f','#8b6914','#1f6f9f','#a0403b'][i%4]}))}}
function extractCharts(report){const charts=[];const moduleName=moduleTypeName(report.type);[report.trendSeries,report.timeSeries,report.dailyData,report.rows,report.records].forEach((rows,i)=>{const c=normalizeTrendRows(rows,i?`${moduleName}趋势 ${i+1}`:`${moduleName}趋势`);if(c)charts.push(c)});cleanArray(report.charts).forEach(chart=>{const direct=normalizeSeriesChart(chart,chart.title||`${moduleName}图表`);if(direct)charts.push(direct);const c=normalizeTrendRows(chart.rows||chart.data||chart.points||chart.trendSeries,chart.title||`${moduleName}趋势`,chart.type||'line');if(c)charts.push(c)});cleanArray(report.tables).forEach(t=>{const c=chartFromTable(t,moduleName);if(c)charts.push(c)});return charts.filter((c,i,arr)=>arr.findIndex(x=>x.title===c.title)===i).slice(0,4)}
function topLevelCharts(){const charts=[];const biomass=normalizeTrendRows(REPORT_DATA.charts?.biomassTrend,'WOFOST 生长动态模型趋势');if(biomass)charts.push(biomass);return charts}
function renderMetrics(metrics){const items=metricItems(metrics).slice(0,12);if(!items.length)return '';return `<div class="metric-grid">${items.map(item=>`<div class="metric-card"><div class="metric-label">${text(item.label)}</div><div class="metric-value">${text(displayValue(item.value,item.label))}${item.unit?`<span style="font-size:13px;margin-left:3px">${escapeHtml(item.unit)}</span>`:''}</div>${item.sub||item.tag||item.level?`<div class="metric-sub">${text(displayValue(item.sub||item.tag||item.level,'level'))}</div>`:''}</div>`).join('')}</div>`}
function renderInsightItems(items){return cleanArray(items).slice(0,10).map(item=>{const obj=typeof item==='object'?item:{title:'分析结论',body:item};const title=itemTitle(obj,'分析结论');const body=itemBody(obj);if(!isPresent(title)&&!isPresent(body))return '';if(!isPresent(body))return '';return `<div class="insight-block ${levelClass(obj.level||obj.priority||obj.status)}"><div class="insight-title">${text(title)}</div><div>${text(displayValue(body))}</div></div>`}).filter(Boolean).join('')}
function renderModuleTables(report){return cleanArray(report.tables).slice(0,4).map(t=>renderTable(t.title||'专项数据表',cleanArray(t.headers).length?cleanArray(t.headers):[],cleanArray(t.rows))).join('')}
function renderSections(report){return cleanArray(report.sections).slice(0,5).map(s=>{const title=typeof s==='object'?s.title:'说明';const items=typeof s==='object'?cleanArray(s.items||s.children||s.points):[s];const html=items.map(x=>itemBody(x)||itemTitle(x,'')).filter(isPresent).map(x=>`<p>${text(x)}</p>`).join('');return html?`<h4>${text(title)}</h4>${html}`:''}).join('')}
function renderChartFigure(chart,id,caption){return `<div class="figure-wrapper"><div class="figure-caption">${escapeHtml(caption)}</div><div class="chart-container" id="${id}"></div></div>`}
function renderModuleReportSection(report,index){const title=report.title||moduleTypeName(report.type);const conclusion=report.conclusion||report.summary||report.overview||report.result||'当前专项数据未给出明确文字结论，以下内容基于已取得指标和趋势结构化展示。';const charts=extractCharts(report);const chartHtml=charts.map((chart,i)=>renderChartFigure(chart,`chart-${index}-${i}`,chart.title)).join('');const analysis=cleanArray(report.analysisItems||report.insights||report.findings||report.diagnosis);const risks=cleanArray(report.risks||report.warnings||report.alerts||report.abnormal);const suggestions=cleanArray(report.suggestions||report.recommendations||report.advice);const suggestionItems=suggestions.map(s=>itemBody(s)||itemTitle(s,'')).filter(isPresent);const link=safeUrl(report.link||report.reportUrl||report.report_url||report.url||report.file_url||report.pdf_url);return `<div class="module-divider"></div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(conclusion)}</p>${renderMetrics(report.metrics||report.kpis||report.index||report.keyMetrics)}${chartHtml}${renderInsightItems(analysis)}${renderSections(report)}${renderModuleTables(report)}${risks.length?`<h4>风险与异常解释</h4>${renderInsightItems(risks)}`:''}${suggestionItems.length?`<h4>专项建议</h4><ul class="recommendation-list">${suggestionItems.slice(0,8).map(s=>`<li>${text(s)}</li>`).join('')}</ul>`:''}${link?`<p class="muted">关联材料：<a href="${escapeHtml(link)}">查看专项报告</a></p>`:''}`}
function renderOverallSynthesis(mods){if(!isOverall())return '';const map=moduleMap();const rows=MODULE_ORDER.map(type=>{const m=map[type];if(!m)return [moduleTypeName(type),'未取得该专项报告数据','未纳入本次综合研判','不生成缺失模块结论'];const metrics=metricItems(m.metrics||m.kpis).slice(0,4).map(x=>`${x.label}:${x.value}${x.unit||''}`).join('；')||'以专项报告字段为准';const conclusion=m.conclusion||m.summary||m.result||'已纳入综合研判';const risks=cleanArray(m.risks||m.warnings||m.alerts).map(itemBody).filter(isPresent);return [moduleTypeName(type),metrics,conclusion,risks.length?risks.slice(0,2).join('；'):'未见显著风险字段']});const available=MODULE_ORDER.filter(t=>map[t]).map(moduleTypeName).join('、')||'暂无专项模块';return `<h3>四模块综合证据矩阵</h3>${renderTable('四类专项报告综合摘要', ['模块','关键指标','主要结论','风险提示'], rows)}<div class="finding-box"><strong>综合研判：</strong>本整体报告以长势分析、三维表型、生长动态与苗情监控为固定证据框架。当前已取得模块包括：${escapeHtml(available)}。未取得的专项数据仅标注缺失，不补造指标、风险或结论。</div>`}
function renderResults(){const mods=getModules();let body=renderOverallSynthesis(mods);const topCharts=topLevelCharts();if(topCharts.length)body+=topCharts.map((chart,i)=>renderChartFigure(chart,`top-chart-${i}`,chart.title)).join('');if(!mods.length){body+='<p class="muted">当前未取得可展示的专项模块数据，报告仅保留基础信息与方法说明。</p>'}else{body+=mods.map((m,i)=>renderModuleReportSection(m,i+1)).join('')}return section(3,'结果与分析',body)}
function renderDiscussion(){const paper=REPORT_DATA.paper||{};const paperDiscussion=cleanArray(paper.discussion).map(itemBody).filter(isPresent);const paperFindings=cleanArray(paper.findings).filter(isPresent);const recs=cleanArray(REPORT_DATA.recommendations);const warnings=cleanArray(REPORT_DATA.plotWarnings);const moduleSuggestions=getModules().flatMap(m=>cleanArray(m.suggestions||m.recommendations||m.advice)).slice(0,10);let body='<p>讨论部分围绕数据证据与生产管理含义展开。所有建议均应结合现场墒情、作物阶段、近期天气和当地农技规范复核。</p>';if(paperDiscussion.length)body+=`<h3>综合讨论</h3>${paperDiscussion.map(x=>`<p>${text(x)}</p>`).join('')}`;const findingHtml=renderInsightItems(paperFindings);if(findingHtml)body+=`<h3>关键发现</h3>${findingHtml}`;const warningHtml=renderInsightItems(warnings);if(warningHtml)body+=`<h3>风险事项</h3>${warningHtml}`;const recItems=recs.map(r=>[itemTitle(r,'建议'),itemBody(r)]).filter(pair=>isPresent(pair[1]));const modItems=moduleSuggestions.map(s=>itemBody(s)||itemTitle(s,'')).filter(isPresent);if(recItems.length||modItems.length){body+=`<h3>农事建议</h3><ul class="recommendation-list">${recItems.map(pair=>`<li><strong>${text(pair[0])}</strong>：${text(pair[1])}</li>`).join('')}${modItems.map(s=>`<li>${text(s)}</li>`).join('')}</ul>`}else{body+='<p class="muted">当前数据未形成明确处置建议，建议继续跟踪关键指标变化并结合现场巡查确认。</p>'}if(getModules().some(m=>m.type==='plot_growth_dynamics'))body+='<div class="disclaimer">生长动态部分使用 WOFOST 日序列模型数据，相关 DVS、LAI、生物量、水分和氮素指标均为模型模拟/预测结果，不等同于实测产量或现场实测值。</div>';return section(4,'讨论与农事建议',body)}
function renderConclusion(){const p=REPORT_DATA.paper||{};const conclusions=cleanArray(p.conclusions).filter(isPresent);const derived=getModules().map(m=>m.conclusion||m.summary||m.result).filter(isPresent);const items=(conclusions.length?conclusions:derived).slice(0,5);const fallback=[`本报告围绕 ${plotName()} 的${reportInfo().name}形成结构化分析。`,'当前结论严格限定在已取得的数据范围内，未对缺失指标作具体数值推断。','建议将本报告作为巡田、灌溉、补苗和后续监测计划的辅助依据。'];const limits=cleanArray(p.limitations).length?cleanArray(p.limitations):['报告受数据完整性、模型参数和观测时间范围影响；涉及 WOFOST 的内容均为模型模拟/预测，应结合现场观测验证。'];const links=cleanArray(p.appendixLinks).concat(getModules().map(m=>m.link||m.reportUrl||m.report_url||m.url).filter(safeUrl));let body=`<ol class="conclusion-list">${(items.length?items:fallback).map(x=>`<li>${text(typeof x==='object'?(itemBody(x)||itemTitle(x,'')):x)}</li>`).join('')}</ol><h3>数据质量与限制</h3>${limits.map(x=>`<p>${text(typeof x==='object'?(itemBody(x)||itemTitle(x,'')):x)}</p>`).join('')}`;if(links.length)body+=`<h3>附录链接</h3><ul class="link-list">${links.slice(0,6).map((l,i)=>`<li><a href="${escapeHtml(safeUrl(l))}">附录材料 ${i+1}</a></li>`).join('')}</ul>`;body+=`<div class="disclaimer">本报告数据来源：${escapeHtml(plotName())}地块真实数据记录。报告仅供生产管理参考，请结合实地情况、当地农技规范和天气条件作出最终决策。</div>`;return section(5,'结论与报告附录',body)}
function renderAcademicChart(id,chart){const dom=document.getElementById(id);if(!dom||!chart)return;if(!window.echarts){dom.innerHTML=`<div class="chart-fallback">${escapeHtml(chart.title)}：图表库未加载，详见相邻数据表。</div>`;return}const isBar=String(chart.type||'').toLowerCase()==='bar';const option={tooltip:{trigger:'axis'},legend:{top:0,textStyle:{fontFamily:'PingFang SC'}},grid:{left:52,right:28,top:48,bottom:42},xAxis:{type:'category',data:chart.labels,axisLabel:{fontFamily:'PingFang SC'}},yAxis:{type:'value',axisLabel:{fontFamily:'PingFang SC'}},series:chart.datasets.map(ds=>({name:ds.label,type:isBar?'bar':'line',smooth:!isBar,showSymbol:!isBar?false:true,data:ds.data,lineStyle:{width:2,color:ds.color},itemStyle:{color:ds.color},areaStyle:isBar?void 0:{opacity:.08}}))};echarts.init(dom).setOption(option)}
function renderAllCharts(){topLevelCharts().forEach((chart,i)=>renderAcademicChart(`top-chart-${i}`,chart));getModules().forEach((m,index)=>extractCharts(m).forEach((chart,i)=>renderAcademicChart(`chart-${index+1}-${i}`,chart)))}
function init(){renderTitlePage();const root=document.getElementById('paper-root');root.innerHTML=renderAbstract()+renderMethods()+renderResults()+renderDiscussion()+renderConclusion();renderAllCharts()}
init();
</script>
</body>
