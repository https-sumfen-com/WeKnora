<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONO 农业报告</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --paper:#fff;
  --canvas:#eef0f2;
  --ink:#24292f;
  --muted:#667085;
  --faint:#8c959f;
  --line:#d9dee3;
  --line-strong:#b9c2cc;
  --green:#176b32;
  --green-mid:#2f8a45;
  --green-soft:#e8f4ea;
  --green-pale:#f4faf5;
  --blue:#0969da;
  --blue-soft:#eef6ff;
  --amber:#9a5b13;
  --amber-soft:#fff7e6;
  --red:#9f1239;
  --red-soft:#fff1f3;
  --gray-soft:#f6f8fa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:14px;line-height:1.72}
body{min-height:100vh}
.page{width:min(100%,210mm);min-height:297mm;margin:0 auto;padding:22mm 18mm 20mm;background:var(--paper);box-shadow:0 18px 50px rgba(31,35,40,.12)}

/* Header */
.report-header{position:relative;text-align:center;border-bottom:2px solid var(--green);padding:20mm 0 14mm;margin-bottom:12mm}
.rpt-eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green);text-transform:uppercase;margin-bottom:4mm;font-weight:700}
.rpt-title{font-size:34px;font-weight:800;color:var(--green);line-height:1.22}
.rpt-subtitle{font-size:17px;color:var(--muted);margin-top:5mm;font-weight:400}
.rpt-meta{width:min(100%,116mm);margin:15mm auto 0;text-align:left;border-top:3px solid var(--green);background:#fafbfa;padding:5mm 9mm 6mm;color:var(--ink)}
.rpt-meta-row{display:grid;grid-template-columns:28mm 1fr;gap:8mm;padding:2.2mm 0;border-bottom:1px solid var(--line);font-size:13px}
.rpt-meta-row:last-child{border-bottom:0}
.rpt-meta-label{color:var(--faint)}
.rpt-meta-value{font-weight:600;color:var(--ink)}
.meta-empty{display:block;text-align:center;color:var(--muted);font-size:13px}
.header-actions{position:absolute;top:0;right:0;display:flex;gap:.45rem;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:3px;border:1px solid var(--line);cursor:pointer;text-decoration:none;transition:.18s ease;background:#fff;color:var(--ink)}
.btn-ghost:hover{background:var(--gray-soft)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:#115527;border-color:#115527}

/* Section */
.section{margin-bottom:11mm}
.sec-label{font-size:22px;font-weight:800;color:var(--green);line-height:1.35;margin-bottom:5mm;display:flex;align-items:center;gap:8px;padding-left:10px;border-left:5px solid var(--green)}
.sec-label i{display:none}
.sec-label::after{content:'';height:1px;background:var(--line);flex:1;margin-left:10px}
.empty-state{background:#fff;border:1px dashed var(--line-strong);color:var(--muted);border-radius:2px;padding:12px;text-align:center;font-size:12px}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:0;border:1px solid var(--line);border-top:3px solid #90c99b;background:#fff}
.kpi-card{background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px;box-shadow:none}
.kpi-card:nth-child(2n){background:#fbfbfb}
.kpi-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:800;color:var(--green);line-height:1.15}
.kpi-unit{font-size:12px;color:var(--muted);margin-left:3px;font-weight:500}
.kpi-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:2px;margin-top:7px;border:1px solid transparent}
.tag-green{background:var(--green-soft);color:var(--green);border-color:#b7dfbf}
.tag-amber{background:var(--amber-soft);color:var(--amber);border-color:#f2d18b}
.tag-red{background:var(--red-soft);color:var(--red);border-color:#f0b4c0}
.tag-blue{background:var(--blue-soft);color:var(--blue);border-color:#b9d7ff}
.tag-gray{background:var(--gray-soft);color:var(--muted);border-color:var(--line)}

/* Two column */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:5mm}

/* Chart cards */
.chart-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:13px 15px;box-shadow:none}
.chart-title{font-size:13px;color:var(--ink);font-weight:700;margin-bottom:10px}

/* Legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.leg-sq{width:10px;height:10px;border-radius:1px;flex-shrink:0}

/* Alert bars */
.alert-stack{display:grid;gap:7px;margin-bottom:5mm}
.alert-bar{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:2px;border:1px solid;border-left-width:4px;font-size:12.5px;line-height:1.6;background:#fff}
.alert-warn{border-color:#e4b45e;color:var(--amber);background:var(--amber-soft)}
.alert-info{border-color:#8bbbf3;color:var(--blue);background:var(--blue-soft)}
.alert-success{border-color:#8bcf98;color:var(--green);background:var(--green-pale)}
.alert-danger{border-color:#db8ea0;color:var(--red);background:var(--red-soft)}
.alert-bar strong{font-weight:600;margin-right:2px}

/* Weather */
.weather-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:5mm;margin-bottom:5mm}
.weather-now-big{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:3px;padding:13px 16px;display:flex;align-items:center;gap:14px;box-shadow:none}
.weather-temp{font-size:40px;font-weight:800;color:var(--green);line-height:1}
.weather-desc{font-size:13px;color:var(--ink);margin-top:5px}
.weather-obs{font-size:11px;color:var(--faint);margin-top:3px}
.weather-metrics{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-top:3px solid #90c99b}
.wm-item{background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:9px 11px;box-shadow:none}
.wm-item:nth-child(2n){background:#fbfbfb}
.wm-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.wm-val{font-size:14px;font-weight:700;color:var(--ink)}

/* Forecast */
.forecast-row{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:1px solid var(--line)}
.fc-day{background:#fff;border-right:1px solid var(--line);padding:8px 4px;text-align:center;box-shadow:none;border-radius:0}
.fc-day:nth-child(2n){background:#fbfbfb}
.fc-day.warn-rain{background:var(--blue-soft)}
.fc-day.warn-heat,.fc-day.warn-wind{background:var(--amber-soft)}
.fc-day.warn-danger{background:var(--red-soft)}
.fc-date{font-size:10.5px;color:var(--muted);margin-bottom:4px}
.fc-icon{font-size:16px;color:var(--green);margin-bottom:2px}
.fc-high{font-size:13px;font-weight:700;color:var(--ink)}
.fc-low{font-size:11.5px;color:var(--muted)}
.fc-prec{font-size:10.5px;color:var(--blue);margin-top:2px}

/* Plot list */
.plot-list{display:grid;gap:0;border:1px solid var(--line);border-top:3px solid #90c99b}
.plot-row{background:#fff;border-bottom:1px solid var(--line);border-radius:0;padding:11px 14px;display:grid;grid-template-columns:2fr 1.5fr 1fr;gap:12px;align-items:center;box-shadow:none}
.plot-row:nth-child(2n){background:#fbfbfb}
.plot-name{font-size:13.5px;font-weight:700;color:var(--ink)}
.plot-crop{font-size:11.5px;color:var(--muted);margin-top:2px}
.progress-wrap{background:#eaeef2;border-radius:0;height:6px;overflow:hidden;margin-bottom:4px}
.progress-bar{height:100%;border-radius:0;background:var(--green)}
.progress-label{font-size:10.5px;color:var(--muted)}

/* Device */
.device-summary{grid-template-columns:repeat(3,1fr);margin-bottom:5mm}
.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:5mm}
.device-card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:11px 13px;box-shadow:none}
.device-card:nth-child(2n){background:#fbfbfb}
.device-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;gap:12px;border-bottom:1px solid var(--line);padding-bottom:7px}
.device-name{font-size:13px;font-weight:700;color:var(--ink)}
.device-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.dot-online{background:var(--green)}
.dot-offline{background:var(--red)}
.dot-fault{background:#c27410}
.dot-unknown{background:var(--faint)}
.telemetry{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line)}
.tele-item{background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:6px 8px}
.tele-label{font-size:10.5px;color:var(--muted)}
.tele-val{font-size:12.5px;font-weight:700;color:var(--ink)}

/* WOFOST */
.wofost-kpi{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-top:3px solid #90c99b}
.wofost-card{background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:11px 13px;box-shadow:none}
.wofost-label{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.wofost-val{font-size:18px;font-weight:800;color:var(--green)}
.wofost-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pheno-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);margin-bottom:0}
.pheno-item{background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:7px 9px}
.pheno-item:nth-child(2n){background:#fbfbfb}
.pheno-label{font-size:10.5px;color:var(--muted)}
.pheno-val{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:2px}
.water-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line)}
.water-item{background:#fff;border-right:1px solid var(--line);padding:9px 8px;text-align:center}
.water-item:nth-child(2n){background:#fbfbfb}
.water-label{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.water-val{font-size:15px;font-weight:800;color:var(--green)}
.report-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:5mm}
.report-link{font-size:11.5px;color:var(--blue);text-decoration:none;background:transparent;border:1px solid #b9d7ff;border-radius:2px;padding:2px 8px}
.report-link:hover{text-decoration:underline}

/* Recommendations */
.rec-list{display:grid;gap:7px}
.rec-item{border-radius:2px;padding:10px 13px;border:1px solid var(--line);border-left:4px solid;box-shadow:none}
.rec-high{background:var(--red-soft);border-left-color:var(--red)}
.rec-mid{background:var(--amber-soft);border-left-color:#c27410}
.rec-low{background:var(--blue-soft);border-left-color:var(--blue)}
.rec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:12px}
.rec-title{font-size:13px;font-weight:800;color:var(--ink)}
.rec-badge{font-size:10px;font-weight:800;padding:1px 7px;border-radius:2px;flex-shrink:0;border:1px solid transparent}
.badge-high{background:#fff;border-color:#ef9aad;color:var(--red)}
.badge-mid{background:#fff;border-color:#ebc270;color:var(--amber)}
.badge-low{background:#fff;border-color:#9cc7f6;color:var(--blue)}
.rec-body{font-size:12px;color:#49515a;line-height:1.7}
.rec-source{font-size:10.5px;color:var(--faint);margin-top:4px}

/* Footer */
.report-footer{font-size:10.5px;color:var(--faint);text-align:center;border-top:1px solid var(--line);padding-top:8px;margin-top:12mm}

@media (max-width:720px){
  .page{width:100%;min-height:0;padding:18px 14px;box-shadow:none}
  .report-header{text-align:left;padding:28px 0 22px;margin-bottom:28px}
  .rpt-title{font-size:28px}
  .rpt-subtitle{font-size:14px}
  .rpt-meta{width:100%;margin-top:22px;padding:12px 14px}
  .rpt-meta-row{grid-template-columns:82px 1fr;gap:12px}
  .header-actions{position:static;width:100%;justify-content:flex-start;margin-top:16px}
  .sec-label{font-size:19px}
  .two-col,.weather-grid{grid-template-columns:1fr}
  .forecast-row{grid-template-columns:repeat(2,1fr)}
  .plot-row{grid-template-columns:1fr}
  .water-grid,.pheno-grid,.wofost-kpi,.device-summary{grid-template-columns:1fr 1fr!important}
}

@media print{
  @page{size:A4;margin:18mm 16mm 18mm}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  .header-actions,.btn{display:none!important}
  .report-header{min-height:250mm;padding-top:26mm;margin-bottom:0;page-break-after:always;break-after:page}
  .section{break-inside:auto;page-break-inside:auto}
  .chart-card,.kpi-card,.plot-row,.device-card,.wofost-card,.rec-item{break-inside:avoid;page-break-inside:avoid}
  .sec-label{break-inside:avoid;break-after:avoid;page-break-after:avoid}
  .chart-card,.kpi-card,.plot-row,.device-card,.wofost-card{box-shadow:none}
}
</style>
</head>
<body>
<div class="page" id="report-root">

  <div class="report-header">
    <div>
      <div class="rpt-eyebrow" id="report-eyebrow">SONO 农业报告</div>
      <div class="rpt-title" id="report-title">SONO 农业报告</div>
      <div class="rpt-subtitle">Agricultural Intelligence Report</div>
      <div class="rpt-meta" id="report-meta">等待真实业务数据填充</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="location.reload()"><i class="ti ti-refresh"></i> 刷新</button>
      <button class="btn btn-primary" onclick="exportReport()"><i class="ti ti-download"></i> 导出 PDF</button>
    </div>
  </div>

  <div class="section" id="section-overview">
    <div class="sec-label"><i class="ti ti-layout-dashboard"></i>概览指标</div>
    <div class="kpi-grid" id="overview-kpis"></div>
  </div>

  <div class="section" id="section-planting">
    <div class="sec-label"><i class="ti ti-plant-2"></i>播种进度与地块结构</div>
    <div class="two-col">
      <div class="chart-card" id="sowing-card">
        <div class="chart-title">各作物播种完成率（%）</div>
        <div class="legend"><span class="leg-item"><span class="leg-sq" style="background:#176B32"></span>已完成</span></div>
        <div style="position:relative;height:165px"><canvas id="sowChart" role="img" aria-label="各作物播种进度水平条形图"></canvas></div>
      </div>
      <div class="chart-card" id="plot-type-card">
        <div class="chart-title">地块类型分布</div>
        <div style="position:relative;height:165px"><canvas id="plotTypeChart" role="img" aria-label="地块类型分布甜甜圈图"></canvas></div>
        <div class="legend" id="plot-type-legend" style="margin-top:.5rem"></div>
      </div>
    </div>
  </div>

  <div class="section" id="section-weather">
    <div class="sec-label"><i class="ti ti-cloud-storm"></i>气象与预警</div>
    <div class="alert-stack" id="weather-alerts"></div>
    <div class="weather-grid" id="weather-now-wrap">
      <div class="weather-now-big">
        <i class="ti ti-sun" style="font-size:44px;color:#FECB00"></i>
        <div>
          <div class="weather-temp" id="weather-temp"></div>
          <div class="weather-desc" id="weather-desc"></div>
          <div class="weather-obs" id="weather-obs"></div>
        </div>
      </div>
      <div class="weather-metrics" id="weather-metrics"></div>
    </div>
    <div class="chart-card" id="forecast-card">
      <div class="chart-title">天气预报</div>
      <div class="forecast-row" id="forecast-row"></div>
    </div>
  </div>

  <div class="section" id="section-plots">
    <div class="sec-label"><i class="ti ti-leaf"></i>地块作物生长状态</div>
    <div class="plot-list" id="plot-list"></div>
  </div>

  <div class="section" id="section-devices">
    <div class="sec-label"><i class="ti ti-device-analytics"></i>设备 IoT 状态</div>
    <div class="kpi-grid device-summary" id="device-summary"></div>
    <div class="device-grid" id="device-grid"></div>
  </div>

  <div class="section" id="section-wofost">
    <div class="sec-label"><i class="ti ti-chart-area-line"></i>WOFOST 作物模型预测</div>
    <div class="two-col" style="margin-bottom:.75rem">
      <div>
        <div class="chart-card" id="pheno-card" style="margin-bottom:.65rem">
          <div class="chart-title" id="pheno-title">关键生育日期</div>
          <div class="pheno-grid" id="pheno-dates"></div>
        </div>
        <div class="wofost-kpi" id="wofost-kpi"></div>
      </div>
      <div class="chart-card" id="bio-card">
        <div class="chart-title">生物量累积趋势（模型模拟）</div>
        <div class="legend">
          <span class="leg-item"><span class="leg-sq" style="background:#0969DA"></span>地上总生物量 TAGP</span>
          <span class="leg-item"><span class="leg-sq" style="background:#176B32"></span>贮藏器官 TWSO</span>
        </div>
        <div style="position:relative;height:200px"><canvas id="bioChart" role="img" aria-label="WOFOST 生物量模拟折线图"></canvas></div>
      </div>
    </div>
    <div class="chart-card" id="water-card">
      <div class="chart-title">水分平衡摘要</div>
      <div class="water-grid" id="water-balance"></div>
    </div>
    <div class="report-links" id="wofost-links"></div>
  </div>

  <div class="section" id="section-recommendations">
    <div class="sec-label"><i class="ti ti-checklist"></i>农事建议汇总</div>
    <div class="rec-list" id="rec-list"></div>
  </div>

  <div class="report-footer" id="report-footer">本报告由大模型根据 SONO-MCP 业务数据生成 · 仅供参考，请结合实地情况决策</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const REPORT_DATA = /* __REPORT_DATA__ */ {
  meta: { plotName: '', subjectName: '', reportDate: '', generatedAt: '' },
  overview: { kpis: [] },
  charts: { sowingProgress: [], plotTypes: [], biomassTrend: [] },
  weather: { now: null, forecast: [], alerts: [] },
  plots: [],
  devices: { summary: {}, items: [] },
  wofost: { phenology: [], kpis: [], waterBalance: [], links: {} },
  recommendations: [],
  emptyStates: []
};

const C={
  bg:'#ffffff',card:'#ffffff',border:'#d9dee3',txt:'#24292f',muted:'#667085',
  green:'#176B32',blue:'#0969DA',amber:'#9A5B13',yellow:'#C29200',red:'#9F1239',gray:'#8C959F'
};
const PALETTE=[C.green,C.blue,C.amber,C.yellow,C.red,C.gray];

function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}
function isPresent(value){
  return value !== null && value !== undefined && value !== '' && value !== 'NaN' && !(typeof value === 'number' && Number.isNaN(value));
}
function fmtNumber(value,digits=0){
  if(!isPresent(value)) return '';
  const n=Number(value);
  if(Number.isNaN(n)) return escapeHtml(value);
  return n.toLocaleString('zh-CN',{maximumFractionDigits:digits});
}
function withUnit(value,unit='',digits=0){
  const formatted=fmtNumber(value,digits);
  return formatted ? `${formatted}${escapeHtml(unit)}` : '';
}
function safeUrl(url){
  if(!isPresent(url)) return '';
  try{
    const parsed=new URL(String(url), window.location.href);
    return ['http:','https:'].includes(parsed.protocol) ? parsed.href : '';
  }catch(_){return '';}
}
function setText(id,value,fallback=''){
  const el=document.getElementById(id);
  if(el) el.textContent=isPresent(value)?String(value):fallback;
}
function hide(id){const el=document.getElementById(id);if(el) el.style.display='none';}
function show(id){const el=document.getElementById(id);if(el) el.style.display='';}
function levelTag(level){
  const map={green:'tag-green',success:'tag-green',normal:'tag-green',amber:'tag-amber',mid:'tag-amber',warn:'tag-amber',red:'tag-red',danger:'tag-red',high:'tag-red',blue:'tag-blue',info:'tag-blue',gray:'tag-gray',low:'tag-blue'};
  return map[String(level||'').toLowerCase()] || 'tag-gray';
}
function recClass(priority){
  const p=String(priority||'low').toLowerCase();
  if(p==='high'||p==='danger') return {item:'rec-high',badge:'badge-high',label:'紧急'};
  if(p==='mid'||p==='medium'||p==='warn') return {item:'rec-mid',badge:'badge-mid',label:'注意'};
  return {item:'rec-low',badge:'badge-low',label:'建议'};
}
function alertClass(level){
  const v=String(level||'info').toLowerCase();
  if(v==='high'||v==='danger'||v==='red') return 'alert-danger';
  if(v==='warn'||v==='mid'||v==='orange'||v==='amber') return 'alert-warn';
  if(v==='success'||v==='green') return 'alert-success';
  return 'alert-info';
}
function cleanArray(value){return Array.isArray(value)?value.filter(Boolean):[];}
function hasKeys(obj){return obj && typeof obj==='object' && Object.keys(obj).some(k=>isPresent(obj[k]));}
function isIdLike(value){return isPresent(value) && /^(?:地块\s*)?(?:ID[:：]?\s*)?\d+$/i.test(String(value).trim());}
function firstNonIdText(values){
  for(const value of values){
    if(isPresent(value) && !isIdLike(value)) return String(value).trim();
  }
  return '';
}
function deriveReportSubject(data={}){
  const meta=data.meta||{};
  const plots=cleanArray(data.plots);
  const devices=data.devices||{};
  const wofost=data.wofost||{};
  const candidates=[meta.plotName,meta.subjectName,meta.name];
  plots.forEach(plot=>candidates.push(plot&&plot.name));
  cleanArray(devices.items).forEach(device=>candidates.push(device&&device.plotName));
  candidates.push(wofost.plotName,wofost.plotNo);
  return firstNonIdText(candidates);
}

function renderHeader(data={}){
  const meta=data.meta||{};
  const title=meta.title || 'SONO 农业报告';
  const derivedSubject=deriveReportSubject(data);
  const rawSubject=meta.subjectName || title;
  const subject=derivedSubject || (isIdLike(rawSubject) ? title : rawSubject);
  setText('report-eyebrow',title);
  setText('report-title',subject);
  document.title=subject===title?title:`${title} — ${subject}`;
  const rows=[];
  if(isPresent(meta.plotName)||subject!==title) rows.push(['分析对象',meta.plotName||subject]);
  if(isPresent(meta.reportDate)) rows.push(['报告日期',meta.reportDate]);
  if(isPresent(meta.periodStart)||isPresent(meta.periodEnd)) rows.push(['报告周期',`${meta.periodStart||''}${meta.periodEnd?' 至 '+meta.periodEnd:''}`]);
  if(isPresent(meta.batchTitle)) rows.push(['关联批次',meta.batchTitle]);
  if(isPresent(meta.generatedAt)) rows.push(['生成时间',meta.generatedAt]);
  const metaEl=document.getElementById('report-meta');
  if(metaEl){
    metaEl.innerHTML=rows.length
      ? rows.map(([label,value])=>`<div class="rpt-meta-row"><span class="rpt-meta-label">${escapeHtml(label)}</span><span class="rpt-meta-value">${escapeHtml(value)}</span></div>`).join('')
      : '<span class="meta-empty">基于真实业务数据生成</span>';
  }
}

function renderOverview(kpis=[]){
  const items=cleanArray(kpis);
  if(!items.length){hide('section-overview');return;}
  const box=document.getElementById('overview-kpis');
  box.innerHTML=items.map(k=>{
    const value=isPresent(k.value)?fmtNumber(k.value,k.digits ?? 0):escapeHtml(k.text||'');
    const unit=isPresent(k.unit)?`<span class="kpi-unit">${escapeHtml(k.unit)}</span>`:'';
    const tag=isPresent(k.tag)?`<span class="kpi-tag ${levelTag(k.level)}">${escapeHtml(k.tag)}</span>`:'';
    return `<div class="kpi-card"><div class="kpi-label">${escapeHtml(k.label)}</div><div class="kpi-value">${value}${unit}</div>${tag}</div>`;
  }).join('');
}

function renderPlantingCharts(charts={}){
  const sow=cleanArray(charts.sowingProgress).filter(x=>isPresent(x.name)&&isPresent(x.value));
  const types=cleanArray(charts.plotTypes).filter(x=>isPresent(x.name)&&isPresent(x.value));
  if(!sow.length && !types.length){hide('section-planting');return;}
  if(!sow.length) hide('sowing-card');
  if(!types.length) hide('plot-type-card');
  if(!window.Chart) return;
  if(sow.length){
    new Chart(document.getElementById('sowChart'),{
      type:'bar',
      data:{labels:sow.map(x=>String(x.name)),datasets:[{label:'播种完成率',data:sow.map(x=>Number(x.value)||0),backgroundColor:C.green,borderRadius:4,barThickness:14}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw+'%'}}},scales:{x:{max:100,ticks:{callback:v=>v+'%',color:C.muted,font:{size:10}},grid:{color:C.border},border:{color:'transparent'}},y:{ticks:{color:C.txt,font:{size:11}},grid:{display:false},border:{color:'transparent'}}}}
    });
  }
  if(types.length){
    const legend=document.getElementById('plot-type-legend');
    legend.innerHTML=types.map((x,i)=>`<span class="leg-item"><span class="leg-sq" style="background:${PALETTE[i%PALETTE.length]}"></span>${escapeHtml(x.name)} ${withUnit(x.value,x.unit||'',0)}</span>`).join('');
    new Chart(document.getElementById('plotTypeChart'),{
      type:'doughnut',
      data:{labels:types.map(x=>String(x.name)),datasets:[{data:types.map(x=>Number(x.value)||0),backgroundColor:types.map((_,i)=>PALETTE[i%PALETTE.length]),borderWidth:0,hoverOffset:8}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.label+': '+ctx.raw.toLocaleString('zh-CN')+(types[ctx.dataIndex]?.unit||'')}}}}
    });
  }
}

function renderWeather(weather={}){
  const now=weather.now;
  const forecast=cleanArray(weather.forecast);
  const alerts=cleanArray(weather.alerts);
  if(!hasKeys(now)&&!forecast.length&&!alerts.length){hide('section-weather');return;}
  const alertBox=document.getElementById('weather-alerts');
  alertBox.innerHTML=alerts.map(a=>`<div class="alert-bar ${alertClass(a.level)}"><i class="ti ${escapeHtml(a.icon||'ti-alert-triangle')}"></i><div><strong>${escapeHtml(a.title||'提示')}</strong> ${escapeHtml(a.body||a.message||'')}</div></div>`).join('');
  if(!alerts.length) alertBox.style.display='none';
  if(hasKeys(now)){
    setText('weather-temp',isPresent(now.temp)?`${now.temp}°C`:'');
    const desc=[now.text,isPresent(now.feelsLike)?`体感 ${now.feelsLike}°C`:null].filter(Boolean).join(' · ');
    setText('weather-desc',desc,'实时天气');
    setText('weather-obs',isPresent(now.obsTime)?`观测时间：${now.obsTime}`:'');
    const metrics=[
      {label:'相对湿度',value:withUnit(now.humidity,'%',0)},
      {label:'风速 / 风向',value:[withUnit(now.windSpeed,' km/h',0),now.windDir].filter(Boolean).join(' · ')},
      {label:'近 1h 降水',value:withUnit(now.precip,' mm',1)},
      {label:'能见度',value:withUnit(now.vis,' km',0)}
    ].filter(x=>isPresent(x.value));
    document.getElementById('weather-metrics').innerHTML=metrics.map(m=>`<div class="wm-item"><div class="wm-label">${escapeHtml(m.label)}</div><div class="wm-val">${escapeHtml(m.value)}</div></div>`).join('');
  }else{
    hide('weather-now-wrap');
  }
  if(forecast.length){
    const row=document.getElementById('forecast-row');
    row.innerHTML=forecast.map(f=>{
      const pre=Number(f.precip||0);
      const wind=Number(f.windScaleDay||0);
      const max=Number(f.tempMax||0);
      const cls=pre>=25||wind>=7?' warn-danger':pre>=10?' warn-rain':(wind>=5||max>=35)?' warn-heat':'';
      const icon=pre>0?'ti-cloud-rain':String(f.textDay||'').includes('阴')?'ti-cloud':'ti-sun';
      return `<div class="fc-day${cls}"><div class="fc-date">${escapeHtml(f.date||f.fxDate||'')}</div><div class="fc-icon"><i class="ti ${icon}"></i></div><div class="fc-high">${isPresent(f.tempMax)?escapeHtml(f.tempMax)+'°':'-'}</div><div class="fc-low">${isPresent(f.tempMin)?escapeHtml(f.tempMin)+'°':'-'}</div>${pre>0?`<div class="fc-prec">${escapeHtml(pre)}mm</div>`:''}</div>`;
    }).join('');
  }else{
    hide('forecast-card');
  }
}

function renderPlots(plots=[]){
  const items=cleanArray(plots).filter(p=>isPresent(p.name));
  if(!items.length){hide('section-plots');return;}
  document.getElementById('plot-list').innerHTML=items.map(p=>{
    const progress=Math.max(0,Math.min(100,Number(p.progress)||0));
    const sub=[p.crop,p.stage].filter(isPresent).map(escapeHtml).join(' · ');
    const progressLabel=isPresent(p.progress)?`生长进度 ${progress}%${isPresent(p.days)?`（第 ${escapeHtml(p.days)} 天）`:''}`:(isPresent(p.days)?`已生长 ${escapeHtml(p.days)} 天`:'暂无进度数据');
    return `<div class="plot-row"><div><div class="plot-name">${escapeHtml(p.name)}</div><div class="plot-crop">${sub||'暂无种植批次数据'}</div></div><div><div class="progress-wrap"><div class="progress-bar" style="width:${progress}%"></div></div><div class="progress-label">${progressLabel}</div></div><div>${isPresent(p.grade)?`<span class="kpi-tag ${levelTag(p.level)}">${escapeHtml(p.grade)}</span>`:''}</div></div>`;
  }).join('');
}

function renderDevices(devices={}){
  const summary=devices.summary||{};
  const items=cleanArray(devices.items);
  if(!hasKeys(summary)&&!items.length){hide('section-devices');return;}
  const summaryItems=[
    {label:'设备总数',value:summary.total,unit:'台',level:'blue'},
    {label:'在线',value:summary.online,unit:'台',level:'green'},
    {label:'离线 / 异常',text:[summary.offline,summary.abnormal].filter(isPresent).join(' / '),level:(Number(summary.offline||0)+Number(summary.abnormal||0)>0)?'red':'green'}
  ].filter(x=>isPresent(x.value)||isPresent(x.text));
  document.getElementById('device-summary').innerHTML=summaryItems.map(k=>`<div class="kpi-card"><div class="kpi-label">${escapeHtml(k.label)}</div><div class="kpi-value">${isPresent(k.value)?fmtNumber(k.value,0):escapeHtml(k.text)}${isPresent(k.unit)?`<span class="kpi-unit">${escapeHtml(k.unit)}</span>`:''}</div></div>`).join('');
  if(!summaryItems.length) document.getElementById('device-summary').style.display='none';
  const statusMap={online:{dot:'dot-online',label:'在线',tag:'tag-green'},offline:{dot:'dot-offline',label:'离线',tag:'tag-red'},fault:{dot:'dot-fault',label:'故障',tag:'tag-amber'},abnormal:{dot:'dot-fault',label:'异常',tag:'tag-amber'},unknown:{dot:'dot-unknown',label:'未知',tag:'tag-gray'}};
  document.getElementById('device-grid').innerHTML=items.map(d=>{
    const s=statusMap[String(d.status||'unknown').toLowerCase()]||statusMap.unknown;
    const sub=[d.type,d.plotName,d.lastTime?`最后通信 ${d.lastTime}`:null].filter(isPresent).map(escapeHtml).join(' · ');
    const metrics=cleanArray(d.metrics).filter(m=>isPresent(m.label)&&isPresent(m.value)).map(m=>`<div class="tele-item"><div class="tele-label">${escapeHtml(m.label)}</div><div class="tele-val">${escapeHtml(m.value)}</div></div>`).join('');
    return `<div class="device-card"><div class="device-header"><div><div class="device-name">${escapeHtml(d.name||'未命名设备')}</div><div class="device-sub">${sub}</div></div><span class="kpi-tag ${s.tag}" style="font-size:10px"><span class="status-dot ${s.dot}"></span>${s.label}</span></div>${metrics?`<div class="telemetry">${metrics}</div>`:''}</div>`;
  }).join('');
}

function renderWofost(wofost={},trend=[]){
  const phenology=cleanArray(wofost.phenology);
  const kpis=cleanArray(wofost.kpis);
  const water=cleanArray(wofost.waterBalance);
  const series=cleanArray(trend).filter(x=>isPresent(x.label)&& (isPresent(x.tagp)||isPresent(x.twso)) );
  const links=wofost.links||{};
  if(!phenology.length&&!kpis.length&&!water.length&&!series.length&&!safeUrl(links.pdf)&&!safeUrl(links.csv)){hide('section-wofost');return;}
  const phenoTitle=['关键生育日期',wofost.plotNo?`地块：${wofost.plotNo}`:null,wofost.stageText].filter(isPresent).join(' · ');
  setText('pheno-title',phenoTitle);
  if(phenology.length){document.getElementById('pheno-dates').innerHTML=phenology.map(p=>`<div class="pheno-item"><div class="pheno-label">${escapeHtml(p.label)}</div><div class="pheno-val">${escapeHtml(p.value)}</div></div>`).join('');}else{hide('pheno-card');}
  if(kpis.length){document.getElementById('wofost-kpi').innerHTML=kpis.map(k=>`<div class="wofost-card"><div class="wofost-label">${escapeHtml(k.label)}</div><div class="wofost-val">${escapeHtml(k.value)}</div>${isPresent(k.sub)?`<div class="wofost-sub">${escapeHtml(k.sub)}</div>`:''}</div>`).join('');}else{document.getElementById('wofost-kpi').style.display='none';}
  if(water.length){document.getElementById('water-balance').innerHTML=water.map(w=>`<div class="water-item"><div class="water-label">${escapeHtml(w.label)}</div><div class="water-val">${escapeHtml(w.value)}</div></div>`).join('');}else{hide('water-card');}
  const pdf=safeUrl(links.pdf), csv=safeUrl(links.csv);
  document.getElementById('wofost-links').innerHTML=[pdf?`<a class="report-link" href="${escapeHtml(pdf)}" target="_blank" rel="noopener">WOFOST PDF 报告</a>`:'',csv?`<a class="report-link" href="${escapeHtml(csv)}" target="_blank" rel="noopener">WOFOST CSV 明细</a>`:''].join('');
  if(!series.length){hide('bio-card');return;}
  if(window.Chart){
    new Chart(document.getElementById('bioChart'),{
      type:'line',
      data:{labels:series.map(x=>String(x.label)),datasets:[
        {label:'TAGP',data:series.map(x=>isPresent(x.tagp)?Number(x.tagp):null),borderColor:C.blue,borderWidth:2,pointRadius:0,tension:.4,fill:false},
        {label:'TWSO',data:series.map(x=>isPresent(x.twso)?Number(x.twso):null),borderColor:C.green,borderWidth:2,pointRadius:0,tension:.4,fill:false,borderDash:[5,3]}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},scales:{x:{ticks:{color:C.muted,font:{size:9},maxTicksLimit:7,autoSkip:true},grid:{color:C.border},border:{color:'transparent'}},y:{ticks:{color:C.muted,font:{size:9}},grid:{color:C.border},border:{color:'transparent'}}}}
    });
  }
}

function renderRecommendations(recs=[]){
  const items=cleanArray(recs);
  const list=items.length?items:[{priority:'low',badge:'建议',title:'未发现明显农事风险',body:'当前未发现明显农事风险，建议按计划巡田并持续关注天气与设备状态。'}];
  const sorted=list.sort((a,b)=>({high:0,mid:1,medium:1,low:2}[String(a.priority||'low').toLowerCase()]??2)-({high:0,mid:1,medium:1,low:2}[String(b.priority||'low').toLowerCase()]??2)).slice(0,5);
  document.getElementById('rec-list').innerHTML=sorted.map(r=>{
    const c=recClass(r.priority);
    const badge=r.badge||c.label;
    return `<div class="rec-item ${c.item}"><div class="rec-header"><div class="rec-title">${escapeHtml(r.title||'农事建议')}</div><span class="rec-badge ${c.badge}">${escapeHtml(badge)}</span></div><div class="rec-body">${escapeHtml(r.body||'请结合现场情况确认。')}</div>${isPresent(r.source)?`<div class="rec-source">依据：${escapeHtml(r.source)}</div>`:''}</div>`;
  }).join('');
}

function renderFooter(meta={}){
  const sources=cleanArray(meta.dataSources).filter(isPresent).join(' / ');
  const sourceText=sources?` · 数据来源：${sources}`:'';
  setText('report-footer',`本报告由大模型根据 SONO-MCP 业务数据生成${sourceText} · 仅供参考，请结合实地情况决策`);
}

function exportReport(){window.print();}

(function init(){
  const data=REPORT_DATA||{};
  renderHeader(data);
  renderOverview(data.overview?.kpis||[]);
  renderPlantingCharts(data.charts||{});
  renderWeather(data.weather||{});
  renderPlots(data.plots||[]);
  renderDevices(data.devices||{});
  renderWofost(data.wofost||{},data.charts?.biomassTrend||[]);
  renderRecommendations(data.recommendations||[]);
  renderFooter(data.meta||{});
})();
</script>
