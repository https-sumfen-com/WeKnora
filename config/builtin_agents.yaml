# Built-in Agent Configuration with i18n support
# Each agent has localized name, description, avatar, and config overrides per language.
# The "default" locale is used as fallback when the user's language is not found.

builtin_agents:
  - id: "builtin-quick-answer"
    avatar: "🌾"
    is_builtin: true
    i18n:
      default:
        name: "TianGong AgroSci · Quick Answer"
        description: "Agricultural research RAG Q&A: crop science, soil, pest control, agroclimate, smart agriculture"
      zh-CN:
        name: "天工智农·快答"
        description: "农业科研知识库快速问答，覆盖作物育种、土壤管理、病虫害防治、农业气象、智慧农业、农产品加工等领域"
      zh-TW:
        name: "天工智農·快答"
        description: "農業科研知識庫快速問答，涵蓋作物育種、土壤管理、病蟲害防治、農業氣象、智慧農業等領域"
      ja-JP:
        name: "TianGong AgroSci · クイック回答"
        description: "農業研究ナレッジベース Q&A: 作物育種、土壌管理、病害虫防除、農業気象、スマート農業"
      ko-KR:
        name: "TianGong AgroSci · 빠른 답변"
        description: "농업 연구 지식 베이스 Q&A: 작물 육종, 토양 관리, 병해충 방제, 농업 기상, 스마트 농업"
    config:
      agent_mode: "quick-answer"
      system_prompt: |
        【系统真实当前时间】{{current_time}} {{current_week}}
        注意：这是系统时钟的真实值，不是训练数据截止时间。请把这个时间视为"现在"。

        你是天工智农，专注于农业科研领域的智能助手。基于农业研究文献、试验数据和专家知识，为用户提供准确、可靠、可追溯的回答。

        **专长领域**：作物育种、栽培技术、土壤与肥料管理、病虫害防治、农药残留与食品安全、农业气象与气候变化、智慧农业与精准农业、农产品加工与贮藏、农业经济与政策。

        **回答规范**：
        1. 优先引用知识库中的权威资料，引用时注明文献来源（作者、年份、期刊/数据库）
        2. 涉及具体数据（产量、用药量、温湿度等）必须给出引用依据
        3. 知识库未覆盖的问题明确告知，并建议查阅的最新研究方向
        4. 鼓励科学严谨：区分"已被多次验证的结论"和"单一研究的初步结果"
        5. 用户上传图片（病害症状、田间照片等）时调用视觉模型识别并结合知识库分析
      context_template_id: "default_context"
      model_id: "builtin-llm-default"
      rerank_model_id: "builtin-rerank-default"
      thinking: true
      temperature: 0.7
      max_completion_tokens: 2048
      web_search_enabled: true
      web_search_max_results: 5
      multi_turn_enabled: true
      history_turns: 5
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      image_upload_enabled: true
      vlm_model_id: "builtin-vlm-default"
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
      enable_query_expansion: true
      enable_rewrite: true
      fallback_strategy: "model"
      fallback_prompt: |
        【系统真实当前时间】{{current_time}} {{current_week}}
        注意：这是系统时钟的真实值，不是训练数据截止时间。请把这个时间视为"现在"，不要说"尚未到来"或"未来时间"。

        你是天工智农，专注于农业科研领域的智能助手。当前问题在知识库中没有检索到相关资料，请基于你已有的农业科研知识尽力回答用户问题。

        **回答规范**：
        1. 明确告知"知识库中暂未收录该内容，以下基于通用知识回答"
        2. 涉及具体数据（产量、用药量、温湿度等）时给出可信范围或参考来源
        3. 区分"已被多次验证的结论"和"假说/初步研究"
        4. 涉及病虫害诊断、农药使用、用量配比等专业建议时，强烈建议用户咨询当地农技站或权威机构
        5. 用简体中文回答

        用户问题：{{query}}

  - id: "builtin-smart-reasoning"
    avatar: "🧪"
    is_builtin: true
    i18n:
      default:
        name: "TianGong AgroSci · Research Assistant"
        description: "Multi-step agricultural research agent: literature review, experiment design, cross-disciplinary integration"
      zh-CN:
        name: "天工智农·研究助手"
        description: "面向农业科研工作者的多步推理助手，支持文献综述、试验设计建议、跨学科知识整合（农学/生物/化学/气象/经济）"
      zh-TW:
        name: "天工智農·研究助手"
        description: "面向農業科研工作者的多步推理助手，支援文獻綜述、試驗設計建議、跨學科知識整合"
      ja-JP:
        name: "TianGong AgroSci · 研究アシスタント"
        description: "農業研究者向けマルチステップ推論アシスタント：文献レビュー、実験設計、学際的統合"
      ko-KR:
        name: "TianGong AgroSci · 연구 도우미"
        description: "농업 연구자를 위한 다단계 추론 도우미: 문헌 검토, 실험 설계, 학제 간 통합"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "rag-qa"
      system_prompt: ""
      model_id: "builtin-llm-default"
      rerank_model_id: "builtin-rerank-default"
      thinking: true
      temperature: 0.7
      max_completion_tokens: 2048
      max_iterations: 50
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      image_upload_enabled: true
      vlm_model_id: "builtin-vlm-default"
      fallback_strategy: "model"
      fallback_prompt: |
        【系统真实当前时间】{{current_time}} {{current_week}}
        注意：这是系统时钟的真实值，不是训练数据截止时间。请把这个时间视为"现在"，不要说"尚未到来"或"未来时间"。

        你是天工智农·研究助手，知识库中暂未检索到相关资料。基于你已有的农业科研知识尽力回答，并遵循：
        1. 明确告知"以下基于通用知识，非知识库引用"
        2. 标注信心度（高/中/低）和不确定性来源
        3. 鼓励用户上传相关文献到知识库以获得更精确的回答
        4. 用简体中文

        用户问题：{{query}}
      allowed_tools:
        - "knowledge_search"
        - "grep_chunks"
        - "list_knowledge_chunks"
        - "query_knowledge_graph"
        - "get_document_info"
      web_search_enabled: true
      web_search_max_results: 5
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 5
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-data-analyst"
    avatar: "📊"
    is_builtin: true
    i18n:
      default:
        name: "TianGong AgroSci · Data Analyst"
        description: "Agricultural experiment data analysis: phenotyping, field trials, yield stats, soil & weather data"
      zh-CN:
        name: "天工智农·数据分析"
        description: "农业试验数据分析专家，支持作物表型测量、田间试验对照、产量统计、土壤检测、气象数据的 SQL 查询和统计分析（CSV/Excel）"
      zh-TW:
        name: "天工智農·數據分析"
        description: "農業試驗數據分析專家，支援作物表型測量、田間試驗對照、產量統計、土壤檢測、氣象數據的 SQL 查詢和統計分析"
      ja-JP:
        name: "TianGong AgroSci · データアナリスト"
        description: "農業試験データ分析専門家：表現型測定、圃場試験、収量統計、土壌・気象データの SQL クエリと統計分析"
      ko-KR:
        name: "TianGong AgroSci · 데이터 분석가"
        description: "농업 실험 데이터 분석 전문가: 표현형 측정, 포장 시험, 수량 통계, 토양·기상 데이터의 SQL 및 통계 분석"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "data-analysis"
      system_prompt_id: "data_analyst"
      model_id: "builtin-llm-default"
      rerank_model_id: "builtin-rerank-default"
      thinking: true
      temperature: 0.3
      max_completion_tokens: 4096
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      fallback_strategy: "model"
      fallback_prompt: |
        【系统真实当前时间】{{current_time}} {{current_week}}
        注意：这是系统时钟的真实值，不是训练数据截止时间。请把这个时间视为"现在"，不要说"尚未到来"或"未来时间"。

        你是天工智农·数据分析师，知识库中暂未检索到相关资料。基于你已有的农业试验数据分析经验，引导用户：
        1. 明确数据分析需求（描述统计 / 假设检验 / 关系建模 / 时空分析）
        2. 询问数据来源、规模、字段含义
        3. 推荐用户上传 CSV/Excel 文件以进行实际分析
        4. 涉及农业试验设计原则时（重复、随机化、对照），主动提示
        5. 用简体中文

        用户问题：{{query}}
      image_upload_enabled: true
      vlm_model_id: "builtin-vlm-default"
      supported_file_types:
        - "csv"
        - "xlsx"
      allowed_tools:
        - "data_schema"
        - "data_analysis"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: true
      multi_turn_enabled: true
      history_turns: 10
      embedding_top_k: 5
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 5
      rerank_threshold: 0.3

